# Stage 4 layout table for the Dink Smallwood remaster (hand-edited, tracked).
#
# Read by `python3 -m analyse build`. Everything here is a tuning knob; the
# build re-derives connectivity from the original data and checks the table
# against it (see README.md, "Tuning regions.toml").
#
# Grid cells are written [col0, row0, col1, row1], inclusive, on the original
# 32 x 24 screen grid (col 0..31 west->east, row 0..23 north->south).
# World axes: x = east, y = south, metres. (Unreal: X = x*100, Y = y*100 cm.)

[layout]
# Base metres per original pixel ("sprite scale"). Evidence (computed and
# echoed into world_layout.json): the hero idle frames are 96-97 px tall
# (1.8 m -> 1.9 cm/px); the open door frame (seq 62) is 64 px tall
# (2.2 m -> 3.4 cm/px). Dink's sprites are drawn with large heads, so the hero
# overstates and doors understate; the geometric mean is 2.5 cm/px, which also
# makes a 50 px tile 1.25 m and the narrowest original 2-tile path 2.5 m before
# region scaling.
base_m_per_px = 0.025
# Minimum shared walkable run (px) for a screen edge to count as crossable.
min_crossing_px = 4
# Land pockets smaller than this (px) are not reported.
min_pocket_px = 1500
# Water components narrower than this (mean width, px) are labelled river.
river_width_px = 70
# Least-squares weight of a screen's size constraints, per kind. Settlements
# hold their shape; wilderness absorbs the scale transitions.
weight = { settlement = 4.0, wilderness = 1.0, sea = 0.5, dungeon = 1.0, interior = 1.0 }
# Detached sheets keep at least this gap (m, bounding box to bounding box) to
# every sheet placed before them. Sight lines in the greybox are about 500 m
# with height fog (bible 05 section C); 1500 m is three times that, so a
# detached region is below the fog horizon from anywhere on the mainland even
# where relief does not hide it.
min_gap_m = 1500.0
# Interior sets are packed in rows south of everything, this far below the
# lowest outdoor extent, with this spacing between sets.
interior_offset_m = 3000.0
interior_spacing_m = 40.0
interior_row_width_m = 1200.0
# Starting position of a new game (dink.ini starting_dink_*; newgame.c sp_x/sp_y).
start = { screen = 1, x = 314, y = 161 }

[scale]
# Linear multiplier on base_m_per_px, per kind (REMASTER_PLAN section 3).
settlement = 4.0
wilderness = 2.75
sea = 2.75
dungeon = 2.25
interior = 1.75

# Sheets: landmasses laid out as one continuous rubber sheet each.
# `anchor = "fixed"` keeps the grid position; `direction` pushes a detached
# sheet away from the sheets placed before it until min_gap_m is met; `offset`
# is added afterwards (metres) for hand tuning.
[sheets.mainland]
anchor = "fixed"

[sheets.joppa]
direction = [-1.0, 0.25]      # out into the West Seas
offset = [0.0, 0.0]

[sheets.darklands]
direction = [0.6, -1.0]       # north-east, behind the northern escarpment
offset = [0.0, 0.0]

[sheets.snow_isle]
direction = [-0.3, -1.0]      # north, over the sea
offset = [0.0, 0.0]

[sheets.fragments]
direction = [-1.0, -1.0]      # unreachable orphan screens, parked out of sight
offset = [0.0, 0.0]

# Per-cell stretch on top of the kind scale (lengthens the Koka bridge).
[[stretch]]
cells = [[22, 22, 31, 22]]
y = 2.0
note = "Koka Isle channel: the walkable bridge 727->759 becomes a long causeway"

# ---------------------------------------------------------------------------
# Areas. First match wins: explicit `screens` lists are checked before any
# `cells`, then areas in file order. `prefixes`, `music` and `signs` are the
# evidence the build expects to see on these screens; agreement raises the
# confidence written to regions.csv, contradiction lowers it.
# Indoor screens are not assigned here: they inherit the region of the
# outdoor door that leads to their interior set (see [[interior]] below).

