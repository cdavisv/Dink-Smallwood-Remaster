# The join: a gap in the west treeline of the Murkwood clearing (SCR_301, the clearing behind the
# sealed gate S366_P15 and the sign S366_P05 "Danger! Murkwood Forest - Has been magically sealed
# shut by decree of King Daniel."). Overlay trigger only; SCR_301 itself is not changed.
[[join]]
id = "murkwood_thin_place"
note = "west treeline of the 1997 Murkwood clearing -> The Thin Place"
from = { screen = 301, rect = [252, 318, 292, 372] }
to = { screen = 332, point = [520, 200] }
back = { screen = 332, rect = [566, 158, 600, 242] }
return = { screen = 301, point = [312, 345] }
