# DinkExpanded content pack 3, first slice: Murkwood Deep (greybox).
# Design and lines: doc/remaster/EXPANDED_CONTENT.md section 6. The owner approved the lines, names and entry on 16 Nov 2026.
# Coordinates are 1997 map pixels (600 x 400 per screen, without the 20 px status bar); DinkC scripts use the
# engine's own x (map x + 20), as every 1997 script does.

[pack]
id = "murkwood"
number = 3                      # namespace: scripts x3-*, globals &x3_*
name = "Murkwood Forest"
wave = "Pack 3"
status = "greybox slice"
draft = false
approved = "16 Nov 2026"

# One sheet: the deep forest King Daniel sealed, laid out beyond the loaded 1997 world, to the west
# (the 1997 map leaves the cells west of the Murkwood clearing empty).
[[sheet]]
id = "deep"
kind = "wilderness"
direction = [-1.0, -0.25]
gap_m = 1500.0

# Screens: unused 1997 map slots (no map.dat record, no 1997 script names them). Grid on the sheet:
