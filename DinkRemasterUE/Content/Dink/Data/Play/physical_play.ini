; Physical play layer (doc/remaster/PHYSICAL_PLAY_LAYER.md): in play, Dink's collision and touches follow the drawn 3D shapes.
; Mode: 0 off (the 1997 boxes for Dink too), 1 auto (on in a game that renders and is not an automation test), 2 on.
; The console variable dink.PhysicalPlay (0/1/2) overrides it. The probe and the parity tests run with the layer off.
; Reach and touch distances are authored.ini's (AttackReachCm x range / 28, PickupReachCm, ContactReachCm).
; Parts (1 on, 0 off; each also a console variable dink.PhysicalPlay.<Part>, -1 = this file), inert while the layer is off:
;   Collision      relaxed hardboxes (relaxed_hardboxes.json): Dink walks up to the drawn tree, rock or wall
;   Touch          pickups, touch scripts and creature touch damage at the drawn item or body
;   Bodies         bug A21: a player-only box on every living creature, so Dink cannot stand inside it (never a trap)
;   Hits           Dink's blows land at drawn contact
;   CreatureReach  creature blows at Dink by the reach of their drawn body, and missiles at Dink at his drawn body
; Hits and CreatureReach are ON: owner decision of 19 Nov 2026, drawn contact for both sides (option (c) of
; doc/remaster/COMBAT_REACH_OPTIONS.md). With the layer off (the probe, the parity tests) every hit decision is the 1997 code path
; (dink.cpp:15460-15527).
[PhysicalPlay]
Mode=1
Collision=1
Touch=1
Bodies=1
Hits=1
CreatureReach=1
