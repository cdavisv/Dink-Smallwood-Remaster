; Physical reach for tagged authored actors only. Virtual sprites and undressed cards
; retain the original DinkC pixel rules. Reach is measured beyond the player's capsule.
[AuthoredInteraction]
AttackReachCm=85
AttackHalfWidthCm=18
TalkReachCm=150
TalkHalfWidthCm=50
; Ground pickups keep a short hand reach. Items raised on furniture may be reached
; over a chair/counter, using a shoulder-height visibility ray that still stops at walls.
PickupReachCm=30
ElevatedPickupReachCm=85
ElevatedPickupMinHeightCm=45
PickupShoulderHeightCm=140
; Damaging touch and pushing require physical contact, allowing a small contact slop.
ContactReachCm=5
