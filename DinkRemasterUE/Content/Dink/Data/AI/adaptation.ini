; The 3D adaptation layer over the Classic brains (UDinkGameplay, Plugins/DinkNarrative/.../DinkBrains.cpp).
; Hand-authored tuning data (REMASTER_PLAN section 2 "AI": short attack wind-ups, at most two attackers at
; once). Play reads this file when the story subsystem starts; parity tests (Dink.AI.*, Dink.Gameplay.*)
; switch the layer off so the original's rules run exactly. Enabled=0 here turns it off for play too.
[Adaptation]
; 1 = on for play.
Enabled=1
; Telegraph: a monster that may attack first stops and faces its target this long (ms), then attacks in
; the direction it aimed. The original attacks at once.
WindUpMs=450
; How many sprites may wind up or attack the same target at once; the others hold position, facing it.
MaxAttackers=2
; A held (capped) attacker looks for a free slot again after this long (ms).
HoldReaimMs=400
