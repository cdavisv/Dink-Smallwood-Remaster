; Dink Smallwood Remaster - engine defaults for a third-person PC game.
; Rendering choices that can only be judged with a display (Lumen/Nanite tuning, Steam Deck
; scalability) are left as TODOs below on purpose; see AGENTS.md "Unverified".

[/Script/EngineSettings.GameMapsSettings]
; The generated greybox (Scripts/import_greybox.sh; git-ignored, so absent in a fresh clone until
; the import has run). The editor opens the engine's empty map so headless runs stay light; open
; /Game/Dink/_Generated/Maps/L_Greybox_Stonebrook or L_Greybox_World by hand (AGENTS.md).
; TODO: point these at /Game/Dink/World/Overworld once a hand-finished world exists.
GameDefaultMap=/Game/Dink/_Generated/Maps/L_Greybox_World
EditorStartupMap=/Engine/Maps/Templates/OpenWorld
GameInstanceClass=/Script/Engine.GameInstance
bOffsetPlayerGamepadIds=False

[/Script/Engine.Engine]
; The DinkCore subsystems hang off the game instance; no custom engine classes.
bSmoothFrameRate=false

[/Script/Engine.RendererSettings]
; Plan (REMASTER_PLAN.md section 2): Lumen GI + reflections, Virtual Shadow Maps, TSR, no baked lighting.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
; TODO (needs a display): Lumen software vs hardware ray tracing (r.Lumen.HardwareRayTracing),
;   r.Lumen.TraceMeshSDFs, Lumen scene detail, and the lighter GI mode for Steam Deck.
; TODO (needs a display): Nanite per-mesh decisions and r.Nanite.MaxPixelsPerEdge for Deck.
; TODO (needs a display): TSR screen-percentage targets per scalability level.

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.CollisionProfile]
; Dink channels for the original hardness codes (bible 04 section 1; Plugins/DinkCore/.../DinkCollision.h
; holds the same channel numbers for C++). Hardness 1/3 (tiles), 100 (sprite hardbox) and 200 (warp
; hardbox) -> DinkHardSolid; hardness 2 "low" (water edges, fences: projectiles and flyers cross) ->
; DinkHardLow. Both block pawns; DinkHardLow ignores the DinkProjectile trace channel.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="DinkProjectile")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=True,Name="DinkHardSolid")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=True,Name="DinkHardLow")
+Profiles=(Name="DinkHardSolid",CollisionEnabled=QueryAndPhysics,bCanModify=False,ObjectTypeName="DinkHardSolid",CustomResponses=((Channel="Camera",Response=ECR_Ignore)),HelpMessage="Original solid hardness (tile 1/3, sprite hardbox 100, warp hardbox 200): blocks walkers and projectiles.")
+Profiles=(Name="DinkHardLow",CollisionEnabled=QueryAndPhysics,bCanModify=False,ObjectTypeName="DinkHardLow",CustomResponses=((Channel="DinkProjectile",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore)),HelpMessage="Original low hardness 2 (water edges, fences): blocks walkers; projectiles, sight and the camera cross.")
+Profiles=(Name="DinkWarpTrigger",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="DinkProjectile",Response=ECR_Ignore),(Channel="DinkHardSolid",Response=ECR_Ignore),(Channel="DinkHardLow",Response=ECR_Ignore)),HelpMessage="Original warp trigger: overlaps pawns only.")
+Profiles=(Name="DinkScreenVolume",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="DinkProjectile",Response=ECR_Ignore),(Channel="DinkHardSolid",Response=ECR_Ignore),(Channel="DinkHardLow",Response=ECR_Ignore)),HelpMessage="Original screen (logical unit): overlaps pawns only.")

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.0

