; Dink Smallwood Remaster - additions to the engine's scalability groups (photoreal pass, 11 Nov 2026).
; Keys here merge into the engine's sections of the same name; levels 0 and 1 (Low/Medium, Steam Deck)
; are left at engine values on purpose so they can still drop these costs.

[ShadowQuality@2]
r.ContactShadows=1

[ShadowQuality@3]
; crisp contact, penumbra widening with distance from the sun's 0.75 degree source angle
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=8
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.ContactShadows=1

[ShadowQuality@Cine]
r.Shadow.Virtual.SMRT.RayCountDirectional=16
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=8
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.5
r.ContactShadows=1

[GlobalIlluminationQuality@3]
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.ScreenTraces=1

[ReflectionQuality@3]
r.Lumen.Reflections.ScreenTraces=1
r.Water.SingleLayer.Reflection=1

[EffectsQuality@0]
dink.GrassDensity=0

[EffectsQuality@1]
dink.GrassDensity=0.5

[EffectsQuality@2]
r.VolumetricFog=1
dink.GrassDensity=0.8

[EffectsQuality@3]
r.VolumetricFog=1
r.VolumetricCloud=1
dink.GrassDensity=1.0
