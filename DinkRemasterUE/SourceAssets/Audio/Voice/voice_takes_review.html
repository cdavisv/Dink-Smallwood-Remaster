<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice takes review</title>
<style>
:root{--bg:#f7f5f0;--fg:#1d1b17;--mute:#6b665c;--card:#fff;--line:#e3dfd6;--keep:#2d7a3a;--redo:#b23a2a;--acc:#5a4ad1}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15140f;--fg:#ece8df;--mute:#9b968b;--card:#1f1d17;--line:#33302a;--keep:#5ec46f;--redo:#ef6a57;--acc:#9b8cff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:0 0 8px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:4px 6px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--card);outline:1px solid var(--line)}nav small{color:var(--mute);float:right}
main{padding:16px 24px 50vh}header{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);z-index:2}
header h2{margin:0 0 4px;font-size:18px}header p{margin:0;color:var(--mute);font-size:13px;max-width:70em}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px}.bar button,.bar label{font:inherit}
.bar button{padding:4px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
.take{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.take.cur{outline:2px solid var(--acc)}.take .who{font-size:12px;color:var(--mute)}.take .txt{margin:2px 0 6px;white-space:pre-wrap}
.take audio{width:100%;height:32px}.take .v{display:flex;flex-direction:column;gap:6px;min-width:150px}
.take .v button{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}
.take.keep .v .k,.take .v .k:hover{border-color:var(--keep);color:var(--keep)}.take.redo .v .r,.take .v .r:hover{border-color:var(--redo);color:var(--redo)}
.take.keep{border-left:4px solid var(--keep)}.take.redo{border-left:4px solid var(--redo)}
.take input{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.help{color:var(--mute);font-size:12px}
@media(max-width:800px){body{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
</style>
<body>
<nav><h1>Voices <small id="tot"></small></h1><div id="nav"></div></nav>
<main>
<header>
<h2 id="vname"></h2><p id="vdesc"></p>
<div class="bar">
<button id="play">Play / pause (Space)</button>
<label><input type="checkbox" id="auto" checked> Auto-advance</label>
<label><input type="checkbox" id="unrev"> Only unreviewed</label>
<label>Sample <select id="samp"><option value="0">all</option><option value="10">10</option><option value="25">25</option></select></label>
<button id="exp">Export verdicts CSV</button>
<span id="stat" class="help"></span>
</div>
<div class="help">K = keep and next, R = redo and next, N / P = next / previous. Type a note in the box when a take needs a redo (what is wrong: pace, emphasis, pronunciation, wrong tone).</div>
</header>
<div id="list"></div>
</main>

const DATA = {"dink": {"desc": "Teenage boy of about sixteen, cocky, flippant and sarcastic, a pig farmer's son convinced he is a legendary warrior, quick with jokes and insults, cracking into panic, rage or real grief in a handful of scenes.", "lines": [{"id": "button6.main.001", "script": "button6", "character": "Dink", "kind": "dialogue", "text": "I don't own a map yet.", "tts": "I don't own a map yet.", "src": "dink/button6.main.001.mp3"}, {"id": "dam-icee.main.004", "script": "dam-icee", "character": "Dink", "kind": "dialogue", "text": "Mission? To what, destroy the Cast?", "tts": "Mission? To what, destroy the Cast?", "src": "dink/dam-icee.main.004.mp3"}, {"id": "dam-icee.main.006", "script": "dam-icee", "character": "Dink", "kind": "dialogue", "text": "Wait..  I don't understand!", "tts": "Wait.. I don't understand!", "src": "dink/dam-icee.main.006.mp3"}, {"id": "escape.main.001", "script": "escape", "character": "Dink", "kind": "dialogue", "text": "Wow, this loaded game looks so familiar.", "tts": "Wow, this loaded game looks so familiar.", "src": "dink/escape.main.001.mp3"}, {"id": "escape.main.002", "script": "escape", "character": "Dink", "kind": "dialogue", "text": "Phew, that was a close one!", "tts": "Phew, that was a close one!", "src": "dink/escape.main.002.mp3"}, {"id": "findduck.main.001", "script": "findduck", "character": "Dink", "kind": "dialogue", "text": "There's that duck!!", "tts": "There's that duck!!", "src": "dink/findduck.main.001.mp3"}, {"id": "findduck.main.002", "script": "findduck", "character": "Dink", "kind": "dialogue", "text": "Where could Ethel's duck be?", "tts": "Where could Ethel's duck be?", "src": "dink/findduck.main.002.mp3"}, {"id": "get-fb.hit.001", "script": "get-fb", "character": "Dink", "kind": "dialogue", "text": "I hate you, scroll of fire!", "tts": "I hate you, scroll of fire!", "src": "dink/get-fb.hit.001.mp3"}, {"id": "get-fb.talk.001", "script": "get-fb", "character": "Dink", "kind": "dialogue", "text": "A lovel reetings, M'lord.", "tts": "Greetings, M'lord.", "src": "dink/king.talk.026.mp3"}, {"id": "king.talk.028", "script": "king", "character": "Dink", "kind": "dialogue", "text": "Well... I think you should lower the pig tax, sir.", "tts": "Well... I think you should lower the pig tax, sir.", "src": "dink/king.talk.028.mp3"}, {"id": "king.talk.030", "script": "king", "character": "Dink", "kind": "dialogue", "text": "Yes - my family got royally screwed by the crown each year.", "tts": "Yes - my family got royally screwed by the crown each year.", "src": "dink/king.talk.030.mp3"}, {"id": "king.talk.032", "script": "king", "character": "Dink", "kind": "dialogue", "text": "I heard about Milder.", "tts": "I heard about Milder.", "src": "dink/king.talk.032.mp3"}, {"id": "king.talk.035", "script": "king", "character": "Dink", "kind": "dialogue", "text": "I would like permission to go after him, my King.", "tts": "I would like permission to go after him, my King.", "src": "dink/king.talk.035.mp3"}, {"id": "king.talk.037", "script": "king", "character": "Dink", "kind": "dialogue", "text": "He grew up in my village - I cannot turn my back on him.", "tts": "He grew up in my village - I cannot turn my back on him.", "src": "dink/king.talk.037.mp3"}, {"id": "king.talk.040", "script": "king", "character": "Dink", "kind": "dialogue", "text": "Please - just tell me the way.", "tts": "Please - just tell me the way.", "src": "dink/king.talk.040.mp3"}, {"id": "king.talk.046", "script": "king", "character": "Dink", "kind": "dialogue", "text": "Thank you.  I'll be back, and I won't be alone.", "tts": "Thank you. I'll be back, and I won't be alone.", "src": "dink/king.talk.046.mp3"}, {"id": "lraise.raise.001", "script": "lraise", "character": "Dink", "kind": "dialogue", "text": "What a gyp!", "tts": "What a gyp!", "src": "dink/lraise.raise.001.mp3"}, {"id": "pdie.die.001", "script": "pdie", "character": "Dink", "kind": "dialogue", "text": "Wow, that was quite a pig!", "tts": "Wow, that was quite a pig!", "src": "dink/pdie.die.001.mp3"}, {"id": "poster.talk.004", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "What?!  Whatever!", "tts": "What?! Whatever!", "src": "dink/poster.talk.004.mp3"}, {"id": "poster.talk.009", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "Pig farmer!? What a crock.  At least I'm on there though.", "tts": "Pig farmer!? What a crock. At least I'm on there though.", "src": "dink/poster.talk.009.mp3"}, {"id": "poster.talk.013", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "Flatstomp got married?  Wow, small world.", "tts": "Flatstomp got married? Wow, small world.", "src": "dink/poster.talk.013.mp3"}, {"id": "poster.talk.015", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "LYNA? NOOO!!!", "tts": "LYNA? NOOO!!!", "src": "dink/poster.talk.015.mp3"}, {"id": "poster.talk.019", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "Yeah!!!!!", "tts": "Yeah!!!!!", "src": "dink/poster.talk.019.mp3"}, {"id": "poster.talk.023", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "Big freakin' deal.", "tts": "Big freakin' deal.", "src": "dink/poster.talk.023.mp3"}, {"id": "poster.talk.026", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "Arg! Oh well, close enough.", "tts": "Arg! Oh well, close enough.", "src": "dink/poster.talk.026.mp3"}, {"id": "poster.talk.030", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "Wow.. Poor Milder...he really wasn't such a bad guy.", "tts": "Wow.. Poor Milder...he really wasn't such a bad guy.", "src": "dink/poster.talk.030.mp3"}, {"id": "poster.talk.034", "script": "poster", "character": "Dink", "kind": "dialogue", "text": "Wow.. Poor Milder...he really wasn't such a bad guy.", "tts": "Wow.. Poor Milder...he really wasn't such a bad guy.", "src": "dink/poster.talk.034.mp3"}, {"id": "s1-blove.main.001", "script": "s1-blove", "character": "Dink", xt": "This is ridiculous.  How can you justify charging this much?", "tts": "This is ridiculous. How can you justify charging this much?", "src": "dink/s1-brg2.talk.003.mp3"}, {"id": "s1-brg2.talk.005", "script": "s1-brg2", "character": "Dink", "kind": "dialogue", "text": "Does the king know about your little 'business'?", "tts": "Does the king know about your little 'business'?", "src": "dink/s1-brg2.talk.005.mp3"}, {"id": "s1-brg2.talk.007", "script": "s1-brg2", "character": "Dink", "kind": "dialogue", "text": "Ah, how nice.", "tts": "Ah, how nice.", "src": "dink/s1-brg2.talk.007.mp3"}, {"id": "s1-bul.main.001", "script": "s1-bul", "character": "Dink", "kind": "dialogue", "text": "Here, piggie piggies.", "tts": "Here, piggie piggies.", "src": "dink/s1-bul.main.001.mp3"}, {"id": "s1-bul.main.003", "script": "s1-bul", "character": "Dink", "kind": "dialogue", "text": "What do you want, Milder?", "tts": "What do you want, Milder?", "src": "dink/s1-bul.main.003.mp3"}, {"id": "s1-bul.main.006", "script": "s1-bul", "character": "Dink", "kind": "dialogue", "text": "I'm NOT a pig farmer.", "tts": "I'm NOT a pig farmer.", "src": "dink/s1-bul.main.006.mp3"}, {"id": "s1-bul.main.008", "script": "s1-bul", "character": "Dink", "kind": "dialogue", "text": "Er..", "tts": "Er..", "src": "dink/s1-bul.main.008.mp3"}, {"id": "s1-bul.main.009", "script": "s1-bul", "character": "Dink", "kind": "dialogue", "text": "Um..", "tts": "Um..", "src": "dink/s1-bul.main.009.mp3"}, {"id": "s1-bul.main.011", "script": "s1-bul", "character": "Dink", "kind": "dialogue", "text": "I *HATE* that guy!", "tts": "I HATE that guy!", "src": "dink/s1-bul.main.011.mp3"}, {"id": "s1-cave.main.001", "script": "s1-cave", "character": "Dink", "kind": "dialogue", "text": "Smells damp in here.", "tts": "Smells damp in here.", "src": "dink/s1-cave.main.001.mp3"}, {"id": "s1-cave.main.002", "script": "s1-cave", "character": "Dink", "kind": "dialogue", "text": "I don't like this one bit...", "tts": "I don't like this "You are not really here, are you!", "src": "dink/s1-wiz.main.009.mp3"}, {"id": "s1-wiz.main.012", "script": "s1-wiz", "character": "Dink", "kind": "dialogue", "text": "How am I supposed to find it if it's hidden?", "tts": "How am I supposed to find it if it's hidden?", "src": "dink/s1-wiz.main.012.mp3"}, {"id": "s1-wiz.main.014", "script": "s1-wiz", "character": "Dink", "kind": "dialogue", "text": "Ok, I may drop by later.. are you in a circus?", "tts": "Ok, I may drop by later.. are you in a circus?", "src": "dink/s1-wiz.main.014.mp3"}, {"id": "s2-auntp.main.009", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Hello.", "tts": "Hello.", "src": "dink/s2-auntp.main.009.mp3"}, {"id": "s2-auntp.main.011", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I'm.. I'm Dink Smallwood.  I got a letter and...", "tts": "I'm.. I'm Dink Smallwood. I got a letter and...", "src": "dink/s2-auntp.main.011.mp3"}, {"id": "s2-auntp.main.013", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "But I...", "tts": "But I...", "src": "dink/s2-auntp.main.013.mp3"}, {"id": "s2-auntp.main.016", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Auntie Maria!", "tts": "Auntie Maria!", "src": "dink/s2-auntp.main.016.mp3"}, {"id": "s2-auntp.main.022", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Thanks, I'm sure it will be fine.", "tts": "Thanks, I'm sure it will be fine.", "src": "dink/s2-auntp.main.022.mp3"}, {"id": "s2-auntp.talk.001", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I just wanted to say, thanks for letting me stay with you.", "tts": "I just wanted to say, thanks for letting me stay with you.", "src": "dink/s2-auntp.talk.001.mp3"}, {"id": "s2-auntp.talk.003", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Whups, gotta get going!  See ya!", "tts": "Whups, gotta get going! See ya!", "src": "dink/s2-auntp.talk.003.mp3"}, {"id": "s2-auntp.talk.004", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Guess what I did today!", "tts": "Guess what I did today!", "src": "dink/s2-auntp.talk.004.mp3"}, {"id": "s2-auntp.talk.006", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Uh, yeah.  How did you know?", "tts": "Uh, yeah. How did you know?", "src": "dink/s2-auntp.talk.006.mp3"}, {"id": "s2-auntp.talk.008", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Ah.  Ok.", "tts": "Ah. Ok.", "src": "dink/s2-auntp.talk.008.mp3"}, {"id": "s2-auntp.talk.009", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "So how do you know my mom?", "tts": "So how do you know my mom?", "src": "dink/s2-auntp.talk.009.mp3"}, {"id": "s2-auntp.talk.011", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Ah, that explains a few things.", "tts": "Ah, that explains a few things.", "src": "dink/s2-auntp.talk.011.mp3"}, {"id": "s2-auntp.talk.012", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "So tell me about Terris.", "tts": "So tell me about Terris.", "src": "dink/s2-auntp.talk.012.mp3"}, {"id": "s2-auntp.talk.014", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "You don't sound so enthusiastic.", "tts": "You don't sound so enthusiastic.", "src": "dink/s2-auntp.talk.014.mp3"}, {"id": "s2-auntp.talk.016", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I saw Jack hit you.", "tts": "I saw Jack hit you.", "src": "dink/s2-auntp.talk.016.mp3"}, {"id": "s2-auntp.talk.018", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Why don't you leave him?  Now?  Tonight?", "tts": "Why don't you leave him? Now? Tonight?", "src": "dink/s2-auntp.talk.018.mp3"}, {"id": "s2-auntp.talk.020", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Well maybe I'll just have to do something about it myself.", "tts": "Well maybe I'll just have to do something about it myself.", "src": "dink/s2-auntp.talk.020.mp3"}, {"id": "s2-auntp.talk.022", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "He ain't nothing, just you watch.", "tts": "He ain't nothing, just you watch.", "src": "dink/s2-auntp.talk.022.mp3"}, {"id": "s2-auntp.talk.023", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I saw Jack hit you.", "tts": "I saw Jack hit you.", "src": "dink/s2-auntp.talk.023.mp3"}, {"id": "s2-auntp.talk.025", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Yes, he's good at it.  I hope to learn much from him.", "tts": "Yes, he's good at it. I hope to learn much from him.", "src": "dink/s2-auntp.talk.025.mp3"}, {"id": "s2-auntp.talk.027", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I just admire his stroke - takes practice you know.", "tts": "I just admire his stroke - takes practice you know.", "src": "dink/s2-auntp.talk.027.mp3"}, {"id": "s2-auntp.talk.028", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "How are you holding up?", "tts": "How are you holding up?", "src": "dink/s2-auntp.talk.028.mp3"}, {"id": "s2-auntp.talk.030", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I like it.  I think the locals like me too.", "tts": "I like it. I think the locals like me too.", "src": "dink/s2-auntp.talk.030.mp3"}, {"id": "s2-auntp.talk.032", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Me too.", "tts": "Me too.", "src": "dink/s2-auntp.talk.032.mp3"}, {"id": "s2-auntp.talk.033", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Say.. I like the room and all, but my bed is a little small.", "tts": "Say.. I like the room and all, but my bed is a little small.", "src": "dink/s2-auntp.talk.033.mp3"}, {"id": "s2-auntp.talk.035", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "What if you traded them in for one big one we could share?", "tts": "What if you traded them in for one big one we could share?", "src": "dink/s2-auntp.talk.035.mp3"}, {"id": "s2-auntp.talk.037", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "And?", "tts": "And?", "src": "dink/s2-auntp.talk.037.mp3"}, {"id": "s2-auntp.talk.039", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Hey guess what, I just got back from a huge adventure.", "tts": "Hey guess what, I just got back from a huge adventure.", "src": "dink/s2-auntp.talk.039.mp3"}, {"id": "s2-auntp.talk.041", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I pretty much saved the universe.", "tts": "I pretty much saved the universe.", "src": "dink/s2-auntp.talk.041.mp3"}, {"id": "s2-auntp.talk.043", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "You don't believe any of this.", "tts": "You don't believe any of this.", "src": "dink/s2-auntp.talk.043.mp3"}, {"id": "s2-auntp.talk.045", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Heh - that's what I like about you auntie!", "tts": "Heh - that's what I like about you auntie!", "src": "dink/s2-auntp.talk.045.mp3"}, {"id": "s2-auntp.talk.046", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "You stupid whore.", "tts": "You stupid whore.", "src": "dink/s2-auntp.talk.046.mp3"}, {"id": "s2-auntp.talk.048", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I see now I shouldn't have killed Jack.", "tts": "I see now I shouldn't have killed Jack.", "src": "dink/s2-auntp.talk.048.mp3"}, {"id": "s2-auntp.talk.049", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "I should have joined forces with him.", "tts": "I should have joined forces with him.", "src": "dink/s2-auntp.talk.049.mp3"}, {"id": "s2-auntp.hit.001", "script": "s2-auntp", "character": "Dink", "kind": "dialogue", "text": "Take your beatin in.025", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "Noted.", "tts": "Noted.", "src": "dink/s2-cave.main.025.mp3"}, {"id": "s2-cave.main.027", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "There's some old man in town who knows some magic.", "tts": "There's some old man in town who knows some magic.", "src": "dink/s2-cave.main.027.mp3"}, {"id": "s2-cave.main.028", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "He might have a spell that could help us.", "tts": "He might have a spell that could help us.", "src": "dink/s2-cave.main.028.mp3"}, {"id": "s2-cave.main.030", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "Oh yeah, sorry.", "tts": "Oh yeah, sorry.", "src": "dink/s2-cave.main.030.mp3"}, {"id": "s2-cave.main.032", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "The damn old man says I'm not powerful enough yet", "tts": "The damn old man says I'm not powerful enough yet", "src": "dink/s2-cave.main.032.mp3"}, {"id": "s2-cave.main.033", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "so I'm trying to raise my skills now.", "tts": "so I'm trying to raise my skills now.", "src": "dink/s2-cave.main.033.mp3"}, {"id": "s2-cave.main.036", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "Ok, ok I'm on it..", "tts": "Ok, ok I'm on it..", "src": "dink/s2-cave.main.036.mp3"}, {"id": "s2-cave.main.039", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "I got the spell, so let's see if it works.", "tts": "I got the spell, so let's see if it works.", "src": "dink/s2-cave.main.039.mp3"}, {"id": "s2-cave.main.042", "script": "s2-cave", "character": "Dink", "kind": "dialogue", "text": "Ok.", "tts": "Ok.", "src": "dink/s2-cave.main.042.mp3"}, {"id": "s2-cave2.main.015", "script": "s2-cave2", "character": "Dink", "kind": "dialogue", "text": "Noooo!!", "tts": "Noooo!!", "src": "dink/s2-cave2.main.015.mp3"}, {"id": "s2-cave2.main.020", "script": "s2-cave2", "character": "Dink", "kind": "dialogue", "text": "Forget ...", "tts": "Forget ...", "src": "dink/s2-cave2.main.020.mp3"}, {"id": "s2-cave2.main.021", "script": "s2-cave2", "character": "Dink", "kind": "dialogue", "text": "I'll forget allright.", "tts": "I'll forget allright.", "src": "dink/s2-cave2.main.021.mp3"}, {"id": "s2-cave2.main.022", "script": "s2-cave2", "character": "Dink", "kind": "dialogue", "text": "Forget to remove my foot from your ASS!!", "tts": "Forget to remove my foot from your ASS!!", "src": "dink/s2-cave2.main.022.mp3"}, {"id": "s2-cave2.main.023", "script": "s2-cave2", "character": "Dink", "kind": "dialogue", "text": "Are you okay?", "tts": "Are you okay?", "src": "dink/s2-cave2.main.023.mp3"}, {"id": "s2-cave2.main.026", "script": "s2-cave2", "character": "Dink", "kind": "dialogue", "text": "I'm sorry I wasn't fast enough.", "tts": "I'm sorry I wasn't fast enough.", "src": "dink/s2-cave2.main.026.mp3"}, {"id": "s2-cave2.main.029", "script": "s2-cave2", "character": "Dink", "kind": "dialogue", "text": "Alright.. what is it?", "tts": "Alright.. what is it?", "src": "dink/s2-cave2.main.029.mp3"}, {"id": "s2-cave2.main.032", "script": "s2-cave2", "character": "Dink", "kind": "dialogue", "text": "Ah man...", "tts": "Ah man...", "src": "dink/s2-cave2.main.032.mp3"}, {"id": "s2-cslay.main.002", "script": "s2-cslay", "character": "Dink", "kind": "dialogue", "text": "It's all over, Nelson.", "tts": "It's all over, Nelson.", "src": "dink/s2-cslay.main.002.mp3"}, {"id": "s2-cslay.main.005", "script": "s2-cslay", "character": "Dink", "kind": "dialogue", "text": "And just what part is that?", "tts": "And just what part is that?", "src": "dink/s2-cslay.main.005.mp3"}, {"id": "s2-culg.talk.001", "script": "s2-culg", "character": "Dink", "kind": "dialogue", "text": "Mary, are you alright?", "tts": "Mary, are you alright?", "src": "dink/s2-culg.talk.001.mp3"}, {"id": "s2-culg.talk.004", "script": "s2-culg", "character": "Dink", "kind": "dialogue", "text": "Time to go home.  Follow me.", "tts": "Time to go home. Follow me.", "src": "dink/s2-culg.talk.004.mp3"}, {"id": "s2-culg.talk.006", "script": "s2-culg", "character": "Dink", "kind": "dialogue", "text": "I brought someone with me.", "tts": "I brought someone with me.", "src": "dink/s2-culg.talk.006.mp3"}, {"id": "s2-culg.talk.011", "script": "s2-culg", "character": "Dink", "kind": "dialogue", "text": "I was just doing my job, ma'am.", "tts": "I was just doing my job, ma'am.", "src": "dink/s2-culg.talk.011.mp3"}, {"id": "s2-culg.die.001", "script": "s2-culg", "character": "Dink", "kind": "dialogue", "text": "Noooooooooooo!  The girl has died! I HAVE FAILED!!!!", "tts": "Noooooooooooo! The girl has died! I HAVE FAILED!!!!", "src": "dink/s2-culg.die.001.mp3"}, {"id": "s2-cult.main.001", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "What a lovely backyard.", "tts": "What a lovely backyard.", "src": "dink/s2-cult.main.001.mp3"}, {"id": "s2-cult.main.002", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "Ah, the memories.", "tts": "Ah, the memories.", "src": "dink/s2-cult.main.002.mp3"}, {"id": "s2-cult.main.010", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "Interesting little party we've got here...", "tts": "Interesting little party we've got here...", "src": "dink/s2-cult.main.010.mp3"}, {"id": "s2-cult.main.022", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "Nah, I think I'd rather shout something.", "tts": "Nah, I think I'd rather shout something.", "src": "dink/s2-cult.main.022.mp3"}, {"id": "s2-cult.main.023", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "Excuse me?", "tts": "Excuse me?", "src": "dink/s2-cult.main.023.mp3"}, {"id": "s2-cult.main.025", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "Get your hands off her, Nelson!  She's coming with me!", "tts": "Get your hands off her, Nelson! She's coming with me!", "src": "dink/s2-cult.main.025.mp3"}, {"id": "s2-cult.main.027", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "Girls!  This man is a lunatic - turn on him and destroy him!", "tts": "Girls! This man is a lunatic - turn on him and destroy him!", "src": "dink/s2-cult.main.027.mp3"}, {"id": "s2-cult.main.028", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "I agree, crucify the new girl!", "tts": "I agree, crucify the new girl!", "src": "dink/s2-cult.main.028.mp3"}, {"id": "s2-cult.main.030", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "I just adore your sadistic rituals.  May I continue to watch?", "tts": "I just adore your sadistic rituals. May I continue to watch?", "src": "dink/s2-cult.main.030.mp3"}, {"id": "s2-cult.main.032", "script": "s2-cult", "character": "Dink", "kind": "dialogue", "text": "Ahh, this is a much better view.", "tts": "Ahh, this is a much better view.", "src": "dink/s2-cult.main.032.mp3"}, {"id": "s2-fgate.touch.001", "script": "s2-fgate", "character": "Dink", "kind": "dialogue", "text": "Ouch!", "tts": "Ouch!", "src": "dink/s2-fgate.touch.001.mp3"}, {"id": "s2-h1-s.main.001", "script": "s2-h1-s", "character": "Dink", "kind": "dialogue", "text": "Whoa, this place looks abandoned...", "tts": "Whoa, this place looks abandoned...", "src": "dink/s2-h1-s.main.001.mp3"}, {"id": "s2-h1-s.main.002", "script": "s2-h1-s", "character": "Dink", "kind": "dialogue", "text": "must've been the monsters nearby.", "tts": "must've been the monsters nearby.", "src": "dink/s2-h1-s.main.002.mp3"}, {"id": "s2-h2-s.main.001", "script": "s2-h2-s", "character": "Dink", "kind": "dialogue", "text": "Not a bad little room.  I think I'm going to enjoy my stay.", "tts": "Not a bad little room. I think I'm going to enjoy my stay.", "src": "dink/s2-h2-s.main.001.mp3"}, {"id": "s2-h2-s.main.002", "script": "s2-h2-s", "character": "Dink", "kind": "dialogue", "text": "Except for that guy Jack...", "tts": "Except for that guy Jack...", "src": "dink/s2-h2-s.main.002.mp3"}, {"id": "s2-healp.talk.001", "script": "s2-healp", "character": "Dink", "kind": "dialogue", "text": "I am healed.", "tts": "I am healed.", "src": "dink/s2-healp.talk.001.mp3"}, {"id": "s2-idol.push.001", "script": "s2-idol", "character": "Dink", "kind": "dialogue", "text": "Uh, darn thing won't budge!!", "tts": "Uh, darn thing won't budge!!", "src": "dink/s2-idol.push.001.mp3"}, {"id": "s2-jack.talk.001", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Hi Jack! Whacha doing?", "tts": "Hi Jack! Whacha doing?", "src": "dink/s2-jack.talk.001.mp3"}, {"id": "s2-jack.talk.003", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "It's real nice of you letting me stay here and all.", "tts": "It's real nice of you letting me stay here and all.", "src": "dink/s2-jack.talk.003.mp3"}, {"id": "s2-jack.talk.005", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Hey Jack!", "tts": "Hey Jack!", "src": "dink/s2-jack.talk.005.mp3"}, {"id": "s2-jack.talk.007", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Eat me!", "tts": "Eat me!", "src": "dink/s2-jack.talk.007.mp3"}, {"id": "s2-jack.talk.009", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Jack.  I know I'm your guest and all but...", "tts": "Jack. I know I'm your guest and all but...", "src": "dink/s2-jack.talk.009.mp3"}, {"id": "s2-jack.talk.011", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "If you touch Maria again, you won't live to see tomorrow.", "tts": "If you touch Maria again, you won't live to see tomorrow.", "src": "dink/s2-jack.talk.011.mp3"}, {"id": "s2-jack.talk.013", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Sorry, not into that.  But I know this guy named Milder...", "tts": "Sorry, not into that. But I know this guy named Milder...", "src": "dink/s2-jack.talk.013.mp3"}, {"id": "s2-jack.talk.014", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Jack.  Guess who was badmouthing you a second ago...", "tts": "Jack. Guess who was badmouthing you a second ago...", "src": "dink/s2-jack.talk.014.mp3"}, {"id": "s2-jack.talk.016", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Yup.  Better lay a bit o law into her, if you know what I mean.", "tts": "Yup. Better lay a bit o law into her, if you know what I mean.", "src": "dink/s2-jack.talk.016.mp3"}, {"id": "s2-jack.talk.022", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Haw!  Good one Jack!", "tts": "Haw! Good one Jack!", "src": "dink/s2-jack.talk.022.mp3"}, {"id": "s2-jack.talk.025", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "Get a clue, honey.  How do you think I kept my mom in line?  Haw!", "tts": "Get a clue, honey. How do you think I kept my mom in line? Haw!", "src": "dink/s2-jack.talk.025.mp3"}, {"id": "s2-jack.die.002", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "I guess I just killed your husband.", "tts": "I guess I just killed your husband.", "src": "dink/s2-jack.die.002.mp3"}, {"id": "s2-jack.die.004", "script": "s2-jack", "character": "Dink", "kind": "dialogue", "text": "I know.  It's ok, I'm here now.", "tts": "I know. It's ok, I'm here now.", "src": "dink/s2-jack.die.004.mp3"}, {"id": "s2-man2.talk.001", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "Greetings men.  I bring stories of my adventures from the East.", "tts": "Greetings men. I bring stories of my adventures from the East.", "src": "dink/s2-man2.talk.001.mp3"}, {"id": "s2-man2.talk.003", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "My name is Dink Smallwood.  I am a warrior!", "tts": "My name is Dink Smallwood. I am a warrior!", "src": "dink/s2-man2.talk.003.mp3"}, {"id": "s2-man2.talk.005", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "Oh yes.  Once, I was in this really scary cave...", "tts": "Oh yes. Once, I was in this really scary cave...", "src": "dink/s2-man2.talk.005.mp3"}, {"id": "s2-man2.talk.007", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "Next thing I knew I was face to face with a huge monster...", "tts": "Next thing I knew I was face to face with a huge monster...", "src": "dink/s2-man2.talk.007.mp3"}, {"id": "s2-man2.talk.010", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "Damn you, Milder!  What are you doing here?", "tts": "Damn you, Milder! What are you doing here?", "src": "dink/s2-man2.talk.010.mp3"}, {"id": "s2-man2.talk.013", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "I don't tend pigs anymore, I'm a mighty warrior.", "tts": "I don't tend pigs anymore, I'm a mighty warrior.", "src": "dink/s2-man2.talk.013.mp3"}, {"id": "s2-man2.talk.017", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "That IS NOT funny.", "tts": "That IS NOT funny.", "src": "dink/s2-man2.talk.017.mp3"}, {"id": "s2-man2.talk.019", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "Great, what kind?", "tts": "Great, what kind?", "src": "dink/s2-man2.talk.019.mp3"}, {"id": "s2-man2.talk.023", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "You stupid rubes!  I hate you both!", "tts": "You stupid rubes! I hate you both!", "src": "dink/s2-man2.talk.023.mp3"}, {"id": "s2-man2.talk.028", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "Look... My farming days are over, ok?", "tts": "Look... My farming days are over, ok?", "src": "dink/s2-man2.talk.028.mp3"}, {"id": "s2-man2.talk.030", "script": "s2-man2", "character": "Dink", "kind": "dialogue", "text": "Oh yes!", "tts": "Oh yes!", "src": "dink/s2-man2.talk.030.mp3"}, {"id": "s2-man2.talk.034", "script": "s2-man2", "character": "Dink", "kind": "  trapped in the dungeon I mean.", "src": "dink/s2-mh-m.talk.002.mp3"}, {"id": "s2-mh-m.talk.005", "script": "s2-mh-m", "character": "Dink", "kind": "dialogue", "text": "Rain?  Rain is the big magic you will teach?", "tts": "Rain? Rain is the big magic you will teach?", "src": "dink/s2-mh-m.talk.005.mp3"}, {"id": "s2-mh-m.talk.007", "script": "s2-mh-m", "character": "Dink", "kind": "dialogue", "text": "I now have Rain Magic.  Yay.", "tts": "I now have Rain Magic. Yay.", "src": "dink/s2-mh-m.talk.007.mp3"}, {"id": "s2-mh-m.talk.012", "script": "s2-mh-m", "character": "Dink", "kind": "dialogue", "text": "Rain?  Rain is the big magic you will teach?", "tts": "Rain? Rain is the big magic you will teach?", "src": "dink/s2-mh-m.talk.012.mp3"}, {"id": "s2-mh-m.talk.014", "script": "s2-mh-m", "character": "Dink", "kind": "dialogue", "text": "I now have Rain Magic.  Yay.", "tts": "I now have Rain Magic. Yay.", "src": "dink/s2-mh-m.talk.014.mp3"}, {"id": "s2-mh-m.talk.016", "script": "s2-mh-m", "character": "Dink", "kind": "dialogue", "text": "Smallwood sir.", "tts": "Smallwood sir.", "src": "dink/s2-mh-m.talk.016.mp3"}, {"id": "s2-mh-m.talk.018", "script": "s2-mh-m", "character": "Dink", "kind": "dialogue", "text": "Aww man.", "tts": "Aww man.", "src": "dink/s2-mh-m.talk.018.mp3"}, {"id": "s2-mh-m.talk.019", "script": "s2-mh-m", "character": "Dink", "kind": "dialogue", "text": "Hey Mister, you know anymore magic you can teach me?", "tts": "Hey Mister, you know anymore magic you can teach me?", "src": "dink/s2-mh-m.talk.019.mp3"}, {"id": "s2-mh-m.talk.021", "script": "s2-mh-m", "character": "Dink", "kind": "dialogue", "text": "Ok, no problem... and my name isn't.. oh.", "tts": "Ok, no problem... and my name isn't.. oh.", "src": "dink/s2-mh-m.talk.021.mp3"}, {"id": "s2-mybed.talk.001", "script": "s2-mybed", "character": "Dink", "kind": "dialogue", "text": "A pretty nice bed.  Looks a lot like my last one.", "tts": "A pretty nice bed. Looks a lot like my last one.", "src": "dink/s2-mybed.talk.001.mp3"}, {"id": "s2-mybed.hit.001", "script": "s2-mybed", "character": "Dink", "kind": "dialogue", "text": "Stop laughing at me, bed!", "tts": "Stop laughing at me, bed!", "src": "dink/s2-mybed.hit.001.mp3"}, {"id": "s2-na1.talk.001", "script": "s2-na1", "character": "Dink", "kind": "dialogue", "text": "This must be the woman's bed.  Looks dirty.", "tts": "This must be the woman's bed. Looks dirty.", "src": "dink/s2-na1.talk.001.mp3"}, {"id": "s2-na1.hit.001", "script": "s2-na1", "character": "Dink", "kind": "dialogue", "text": "Clean yourself!", "tts": "Clean yourself!", "src": "dink/s2-na1.hit.001.mp3"}, {"id": "s2-na2.talk.001", "script": "s2-na2", "character": "Dink", "kind": "dialogue", "text": "Such a small bed.", "tts": "Such a small bed.", "src": "dink/s2-na2.talk.001.mp3"}, {"id": "s2-na2.hit.001", "script": "s2-na2", "character": "Dink", "kind": "dialogue", "text": "LITTLE THINGS MUST DIE!", "tts": "LITTLE THINGS MUST DIE!", "src": "dink/s2-na2.hit.001.mp3"}, {"id": "s2-nadp.talk.001", "script": "s2-nadp", "character": "Dink", "kind": "dialogue", "text": "Say, how are you and the little tike doing?", "tts": "Say, how are you and the little tike doing?", "src": "dink/s2-nadp.talk.001.mp3"}, {"id": "s2-nadp.talk.003", "script": "s2-nadp", "character": "Dink", "kind": "dialogue", "text": "I see you have not had time to clean the house...", "tts": "I see you have not had time to clean the house...", "src": "dink/s2-nadp.talk.003.mp3"}, {"id": "s2-nadp.talk.005", "script": "s2-nadp", "character": "Dink", "kind": "dialogue", "text": "Little Mary is still out there, somewhere.", "tts": "Little Mary is still out there, somewhere.", "src": "dink/s2-nadp.talk.005.mp3"}, {"id": "s2-nadp.talk.007", "script": "s2-nadp", "character": "Dink", "kind": "dialogue", "text": "Yes.. unless she was kidnapped by really nice people.", "tts": "Yes.. unless she was kidnapped by really nice people.", "src": "dink/s2-nadp.talk.007.mp3"}, {"id": "s2-nadp.talk.009", "s : "Dink Smallwood sir.", "tts": "Dink Smallwood sir.", "src": "dink/sc-wiz.talk.021.mp3"}, {"id": "sc-wiz.talk.024", "script": "sc-wiz", "character": "Dink", "kind": "dialogue", "text": "What??", "tts": "What??", "src": "dink/sc-wiz.talk.024.mp3"}, {"id": "sc-wiz.talk.026", "script": "sc-wiz", "character": "Dink", "kind": "dialogue", "text": "Hey, you wanna tell me what you're talking about?", "tts": "Hey, you wanna tell me what you're talking about?", "src": "dink/sc-wiz.talk.026.mp3"}, {"id": "sc-wiz.talk.031", "script": "sc-wiz", "character": "Dink", "kind": "dialogue", "text": "There is some chaos brewing in this land now.", "tts": "There is some chaos brewing in this land now.", "src": "dink/sc-wiz.talk.031.mp3"}, {"id": "sc-wiz.talk.032", "script": "sc-wiz", "character": "Dink", "kind": "dialogue", "text": "We don't know who's behind it either.  I was on my way to", "tts": "We don't know who's behind it either. I was on my way to", "src": "dink/sc-wiz.talk.032.mp3"}, {"id": "sc-wiz.talk.033", "script": "sc-wiz", "character": "Dink", "kind": "dialogue", "text": "the darklands when I came here, I have to rescue a friend.", "tts": "the darklands when I came here, I have to rescue a friend.", "src": "dink/sc-wiz.talk.033.mp3"}, {"id": "sfood.touch.001", "script": "sfood", "character": "Dink", "kind": "dialogue", "text": "Yum!", "tts": "Yum!", "src": "dink/sfood.touch.001.mp3"}, {"id": "spice.talk.001", "script": "spice", "character": "Dink", "kind": "dialogue", "text": "Oh my god, it's you!!!", "tts": "Oh my god, it's you!!!", "src": "dink/spice.talk.001.mp3"}, {"id": "spice.talk.003", "script": "spice", "character": "Dink", "kind": "dialogue", "text": "Uhh ...", "tts": "Uhh ...", "src": "dink/spice.talk.003.mp3"}, {"id": "spice.talk.004", "script": "spice", "character": "Dink", "kind": "dialogue", "text": "Let's not discuss that now Sporty.  Let's talk about you ..", "tts": "Let's not discuss that now Sporty. Let's talk about you ..", "src": "dink/spice.talk.004.mp3"}, {"id": "spice.talk.005", "script": "spice", "character": "Dink", "kind": "dialogue", "text": "all five of you and me!!", "tts": "all five of you and me!!", "src": "dink/spice.talk.005.mp3"}, {"id": "start-3.click.005", "script": "start-3", "character": "Dink", "kind": "dialogue", "text": "Wait a minute!", "tts": "Wait a minute!", "src": "dink/start-3.click.005.mp3"}, {"id": "start-3.click.006", "script": "start-3", "character": "Dink", "kind": "dialogue", "text": "Hi.", "tts": "Hi.", "src": "dink/start-3.click.006.mp3"}, {"id": "start-3.click.007", "script": "start-3", "character": "Dink", "kind": "dialogue", "text": "This game is only $15?", "tts": "This game is only $15?", "src": "dink/start-3.click.007.mp3"}, {"id": "start-3.click.009", "script": "start-3", "character": "Dink", "kind": "dialogue", "text": "Is this some kind of joke?  This ain't funny.", "tts": "Is this some kind of joke? This ain't funny.", "src": "dink/start-3.click.009.mp3"}, {"id": "start-3.click.011", "script": "start-3", "character": "Dink", "kind": "dialogue", "text": "Incredible!!!  Thank you magic voice.", "tts": "Incredible!!! Thank you magic voice.", "src": "dink/start-3.click.011.mp3"}, {"id": "water.hit.001", "script": "water", "character": "Dink", "kind": "dialogue", "text": "Yum, water!", "tts": "Yum, water!", "src": "dink/water.hit.001.mp3"}]}, "man_middle": {"desc": "Ordinary middle-aged man, an all-purpose voice that runs from tired and polite to gruff, anxious or angry.", "lines": [{"id": "dam-icee.main.001", "script": "dam-icee", "character": "cave prisoner", "kind": "dialogue", "text": "Woah!", "tts": "Woah!", "src": "man_middle/dam-icee.main.001.mp3"}, {"id": "dam-icee.main.002", "script": "dam-icee", "character": "cave prisoner", "kind": "dialogue", "text": "Woohoo!  I'm a free man at last!", "tts": "Woohoo! I'm a free man at last!", "src": "man_middle/dam-icee.main.002.mp3"}, {"id": "dam-icee.main.003", "script": "dam-icee", "character": "cave prisoner", "kind": "dialogue", "text": "I must now complete my mission.", "tts": "I must now complete my mission.", "src": "man_middle/dam-icee.main.003.mp3"}, {"id": "dam-icee.main.005", "script": "dam-icee", "character": "cave prisoner", "kind": "dialogue", "text": "Actually, it was to stop a freak named Bishop Nelson.", "tts": "Actually, it was to stop a freak named Bishop Nelson.", "src": "man_middle/dam-icee.main.005.mp3"}, {"id": "dam-icee.main.007", "script": "dam-icee", "character": "cave prisoner", "kind": "dialogue", "text": "It's best that way.  Now follow me, I'll get you out of here.", "tts": "It's best that way. Now follow me, I'll get you out of here.", "src": "man_middle/dam-icee.main.007.mp3"}, {"id": "s1-brg2.hit.001", "script": "s1-brg2", "character": "toll man", "kind": "dialogue", "text": "Did something touch me?  A fly perhaps?", "tts": "Did something touch me? A fly perhaps?", "src": "man_middle/s1-brg2.hit.001.mp3"}, {"id": "s1-brg2.talk.001", "script": "s1-brg2", "character": "toll man", "kind": "dialogue", "text": "You don't have enough gold, fool!", "tts": "You don't have enough gold, fool!", "src": "man_middle/s1-brg2.talk.001.mp3"}, {"id": "s1-brg2.talk.002", "script": "s1-brg2", "character": "toll man", "kind": "dialogue", "text": "Thanks.  Have a nice day.", "tts": "Thanks. Have a nice day.", "src": "man_middle/s1-brg2.talk.002.mp3"}, {"id": "s1-brg2.talk.004", "script": "s1-brg2", "character": "toll man", "kind": "dialogue", "text": "My kids need to eat.", "tts": "My kids need to eat.", "src": "man_middle/s1-brg2.talk.004.mp3"}, {"id": "s1-brg2.talk.006", "script": "s1-brg2", "character": "toll man", "kind": "dialogue", "text": "Of course not.", "tts": "Of course not.", "src": "man_middle/s1-brg2.talk.006.mp3"}, {"id": "s1-h3-5.touch.001", "script": "s1-h3-5", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Not so fast, Smallwood!", "tts": "Not so fast, Smallwood!", "src": "man_middle/s1-h3-5.touch.001.mp3"}, {"id": "s1-h3-of.main.001", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "I'm sorry my dear, I miss you...", "tts": "I'm sorry my dear, I miss you...", "src": "man_middle/s1-h3-of.main.001.mp3"}, {"id": "s1-h3-of.main.002", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Oh Dink!!  Sorry, didn't see you there.", "tts": "Oh Dink!! Sorry, didn't see you there.", "src": "man_middle/s1-h3-of.main.002.mp3"}, {"id": "s1-h3-of.main.003", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Dink!  I hope you're doing okay.", "tts": "Dink! I hope you're doing okay.", "src": "man_middle/s1-h3-of.main.003.mp3"}, {"id": "s1-h3-of.main.004", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Tragic, what happened.", "tts": "Tragic, what happened.", "src": "man_middle/s1-h3-of.main.004.mp3"}, {"id": "s1-h3-of.main.005", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Oh Dink, how goes the battle?", "tts": "Oh Dink, how goes the battle?", "src": "man_middle/s1-h3-of.main.005.mp3"}, {"id": "s1-h3-of.main.006", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Ah Dink, savior of my farm!", "tts": "Ah Dink, savior of my farm!", "src": "man_middle/s1-h3-of.main.006.mp3"}, {"id": "s1-h3-of.talk.002", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "We're fine.", "tts": "We're fine.", "src": "man_middle/s1-h3-of.talk.002.mp3"}, {"id": "s1-h3-of.talk.004", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Dink, I'm so sorry about your mother.", "tts": "Dink, I'm so sorry about your mother.", "src": "man_middle/s1-h3-of.talk.004.mp3"}, {"id": "s1-h3-of.talk.005", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "She was a good lady.", "tts": "She was a good lady.", "src": "man_middle/s1-h3-of.talk.005.mp3"}, {"id": "s1-h3-of.talk.008", p next year's harvest.", "src": "man_middle/s1-h3-of.talk.018.mp3"}, {"id": "s1-h3-of.talk.020", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "For you Dink, yes go right up.", "tts": "For you Dink, yes go right up.", "src": "man_middle/s1-h3-of.talk.020.mp3"}, {"id": "s1-h3-of.talk.021", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "No, no you may not right now.", "tts": "No, no you may not right now.", "src": "man_middle/s1-h3-of.talk.021.mp3"}, {"id": "s1-h3-of.talk.022", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "She is not to be disturbed.", "tts": "She is not to be disturbed.", "src": "man_middle/s1-h3-of.talk.022.mp3"}, {"id": "s1-h3-of.talk.024", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Well, my farm is off to the west a bit.", "tts": "Well, my farm is off to the west a bit.", "src": "man_middle/s1-h3-of.talk.024.mp3"}, {"id": "s1-h3-of.talk.025", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "The monsters seem to be trampling it constantly.", "tts": "The monsters seem to be trampling it constantly.", "src": "man_middle/s1-h3-of.talk.025.mp3"}, {"id": "s1-h3-of.talk.026", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Please see what you can do Dink.", "tts": "Please see what you can do Dink.", "src": "man_middle/s1-h3-of.talk.026.mp3"}, {"id": "s1-h3-of.hit.001", "script": "s1-h3-of", "character": "Mr. SmileStein", "kind": "dialogue", "text": "Please, I'm not in the mood.", "tts": "Please, I'm not in the mood.", "src": "man_middle/s1-h3-of.hit.001.mp3"}, {"id": "s1-rob2.main.001", "script": "s1-rob2", "character": "robbery victim", "kind": "dialogue", "text": "Please, I've no money, I'm just traveling light.", "tts": "Please, I've no money, I'm just traveling light.", "src": "man_middle/s1-rob2.main.001.mp3"}, {"id": "s1-rob2.main.003", "script": "s1-rob2", "character": "robbery victim", "kind": "dialogue", "text": "I'm just passing through to Windemere sir.", "tts": "I'm just passing through to Windemere sir.", "src": "man_middle/s1-rob2.main.003.mp3"}, {"id": "s1-rob2.main.006", "script": "s1-rob2", "character": "robbery victim", "kind": "dialogue", "text": "I don't have that much sir.", "tts": "I don't have that much sir.", "src": "man_middle/s1-rob2.main.006.mp3"}, {"id": "s1-rob2.main.010", "script": "s1-rob2", "character": "robbery victim", "kind": "dialogue", "text": "Someone, help!", "tts": "Someone, help!", "src": "man_middle/s1-rob2.main.010.mp3"}, {"id": "s1-vic.talk.001", "script": "s1-vic", "character": "robbery victim", "kind": "dialogue", "text": "Help me please!", "tts": "Help me please!", "src": "man_middle/s1-vic.talk.001.mp3"}, {"id": "s1-vic.talk.003", "script": "s1-vic", "character": "robbery victim", "kind": "dialogue", "text": "Thanks to you I am.  Those guys would've killed me!", "tts": "Thanks to you I am. Those guys would've killed me!", "src": "man_middle/s1-vic.talk.003.mp3"}, {"id": "s1-vic.talk.006", "script": "s1-vic", "character": "robbery victim", "kind": "dialogue", "text": "Well, like I said I travel light and don't have", "tts": "Well, like I said I travel light and don't have", "src": "man_middle/s1-vic.talk.006.mp3"}, {"id": "s1-vic.talk.007", "script": "s1-vic", "character": "robbery victim", "kind": "dialogue", "text": "much with me.", "tts": "much with me.", "src": "man_middle/s1-vic.talk.007.mp3"}, {"id": "s1-vic.talk.008", "script": "s1-vic", "character": "robbery victim", "kind": "dialogue", "text": "Here, take this gold piece, it's all I can spare.", "tts": "Here, take this gold piece, it's all I can spare.", "src": "man_middle/s1-vic.talk.008.mp3"}, {"id": "s2-auntp.main.001", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "This will learn you to talk back to me!", "tts": "This will learn you to talk back to me!", "src": "man_middle/s2-auntp.main.001.mp3"}, {"id": "s2-auntp.main.003", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "Shut your trap!", "tts": "Shut your trap!", "src": "man_middle/s2-auntp.main.003.mp3"}, {"id": "s2-auntp.main.005", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "Through are we?", "tts": "Through are we?", "src": "man_middle/s2-auntp.main.005.mp3"}, {"id": "s2-auntp.main.006", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "You ok, baby?", "tts": "You ok, baby?", "src": "man_middle/s2-auntp.main.006.mp3"}, {"id": "s2-auntp.main.007", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "You shouldn't make me so mad.", "tts": "You shouldn't make me so mad.", "src": "man_middle/s2-auntp.main.007.mp3"}, {"id": "s2-auntp.main.010", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "Who the hell are you?", "tts": "Who the hell are you?", "src": "man_middle/s2-auntp.main.010.mp3"}, {"id": "s2-auntp.main.012", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "I ain't sent no letter to nobody nohow.", "tts": "I ain't sent no letter to nobody nohow.", "src": "man_middle/s2-auntp.main.012.mp3"}, {"id": "s2-auntp.main.014", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "Git outta my house.", "tts": "Git outta my house.", "src": "man_middle/s2-auntp.main.014.mp3"}, {"id": "s2-auntp.main.017", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "What the? How do you know my wife?  You two been cheatin' on me?", "tts": "What the? How do you know my wife? You two been cheatin' on me?", "src": "man_middle/s2-auntp.main.017.mp3"}, {"id": "s2-auntp.main.020", "script": "s2-auntp", "character": "Jack Kneedlewood", "kind": "dialogue", "text": "Huh?  Since when? Gawd dammit!", "tts": "Huh? Since when? Gaw "kind": "dialogue", "text": "Who me?", "tts": "Who me?", "src": "man_middle/s2-ryant.talk.007.mp3"}, {"id": "s2-ryant.talk.009", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "Hehe, yes well, I'm a ... a .. specialist.", "tts": "Hehe, yes well, I'm a ... a .. specialist.", "src": "man_middle/s2-ryant.talk.009.mp3"}, {"id": "s2-ryant.talk.011", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "Let's just say I help acquire things..", "tts": "Let's just say I help acquire things..", "src": "man_middle/s2-ryant.talk.011.mp3"}, {"id": "s2-ryant.talk.013", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "Nothing that should interest you.", "tts": "Nothing that should interest you.", "src": "man_middle/s2-ryant.talk.013.mp3"}, {"id": "s2-ryant.talk.014", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "Now be on your way.", "tts": "Now be on your way.", "src": "man_middle/s2-ryant.talk.014.mp3"}, {"id": "s2-ryant.talk.015", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "You again?", "tts": "You again?", "src": "man_middle/s2-ryant.talk.015.mp3"}, {"id": "s2-ryant.talk.017", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "YOU?!?", "tts": "YOU?!?", "src": "man_middle/s2-ryant.talk.017.mp3"}, {"id": "s2-ryant.talk.018", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "Are you sure?", "tts": "Are you sure?", "src": "man_middle/s2-ryant.talk.018.mp3"}, {"id": "s2-ryant.talk.020", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "Hmmmmm", "tts": "Hmmmmm", "src": "man_middle/s2-ryant.talk.020.mp3"}, {"id": "s2-ryant.talk.021", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "Well I guess my other guy's not showing up.", "tts": "Well I guess my other guy's not showing up.", "src": "man_middle/s2-ryant.talk.021.mp3"}, {"id": "s2-ryant.talk.022", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "So you're in.", "tts": "So you're in.", "src": "man_middle/s2-ryant.talk.022.mp3"}, {"id": "s2-ryant.talk.023", "script": "s2-ryant", "character": "Thief", "kind": "dialogue", "text": "Meet me west of here when you're ready", "tts": "Meet me west of here when you're ready", "src": "man_middle/s2-ryant.talk.023.mp3"}, {"id": "s2-wand.main.001", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "Hello there sir.", "tts": "Hello there sir.", "src": "man_middle/s2-wand.main.001.mp3"}, {"id": "s2-wand.talk.002", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "Well, I'm a hunter.", "tts": "Well, I'm a hunter.", "src": "man_middle/s2-wand.talk.002.mp3"}, {"id": "s2-wand.talk.003", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "Hope to find some good furs in these parts.", "tts": "Hope to find some good furs in these parts.", "src": "man_middle/s2-wand.talk.003.mp3"}, {"id": "s2-wand.talk.006", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "No, not really.  It's been kinda weird.", "tts": "No, not really. It's been kinda weird.", "src": "man_middle/s2-wand.talk.006.mp3"}, {"id": "s2-wand.talk.007", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "I've seen a lot of monsters around lately though,", "tts": "I've seen a lot of monsters around lately though,", "src": "man_middle/s2-wand.talk.007.mp3"}, {"id": "s2-wand.talk.008", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "it's like maybe they scared off all the animals.", "tts": "it's like maybe they scared off all the animals.", "src": "man_middle/s2-wand.talk.008.mp3"}, {"id": "s2-wand.hit.001", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "Sir, nooo.  I don't take kindly to bruising.", "tts": "Sir, nooo. I don't take kindly to bruising.", "src": "man_middle/s2-wand.hit.001.mp3"}, {"id": "s2-wand.hit.002", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "I'm warning you sir, please stop that.", "tts": "I'm warning you sir, please stop that.", "src": "man_middle/s2-wand.hit.002.mp3"}, {"id": "s2-wand.hit.003", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "That's it, I'm outta here!", "tts": "That's it, I'm outta here!", "src": "man_middle/s2-wand.hit.003.mp3"}, {"id": "s2-wand.story1.001", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "I've heard many strange tales in my day.", "tts": "I've heard many strange tales in my day.", "src": "man_middle/s2-wand.story1.001.mp3"}, {"id": "s2-wand.story1.002", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "One particular tale spoke of an island in the sea.", "tts": "One particular tale spoke of an island in the sea.", "src": "man_middle/s2-wand.story1.002.mp3"}, {"id": "s2-wand.story1.003", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "Where both humans and dragons lived.", "tts": "Where both humans and dragons lived.", "src": "man_middle/s2-wand.story1.003.mp3"}, {"id": "s2-wand.story1.004", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "And in peace, no wars, no fighting.", "tts": "And in peace, no wars, no fighting.", "src": "man_middle/s2-wand.story1.004.mp3"}, {"id": "s2-wand.story1.005", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "I even heard there was an underground tunnel to it.", "tts": "I even heard there was an underground tunnel to it.", "src": "man_middle/s2-wand.story1.005.mp3"}, {"id": "s2-wand.story1.006", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "They say it was a beautiful island to visit.", "tts": "They say it was a beautiful island to visit.", "src": "man_middle/s2-wand.story1.006.mp3"}, {"id": "s2-wand.story1.007", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "But I don't think it exists, just an old tale.", "tts": "But I don't think it exists, just an old tale.", "src": "man_middle/s2-wand.story1.007.mp3"}, {"id": "s2-wand.story2.001", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "A long time ago there used to be an entire goblin castle", "tts": "A long time ago there used to be an entire goblin castle", "src": "man_middle/s2-wand.story2.001.mp3"}, {"id": "s2-wand.story2.002", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "in this land.", "tts": "in this land.", "src": "man_middle/s2-wand.story2.002.mp3"}, {"id": "s2-wand.story2.003", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "It's said they launched attack and attack from it,", "tts": "It's said they launched attack and attack from it,", "src": "man_middle/s2-wand.story2.003.mp3"}, {"id": "s2-wand.story2.004", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "terrorizing the land.", "tts": "terrorizing the land.", "src": "man_middle/s2-wand.story2.004.mp3"}, {"id": "s2-wand.story2.005", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "But they say a magic user came and cast a mighty spell on the castle.", "tts": "But they say a magic user came and cast a mighty spell on the castle.", "src": "man_middle/s2-wand.story2.005.mp3"}, {"id": "s2-wand.story2.006", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "So strong that it teleported the castle to the icelands in the north.", "tts": "So strong that it teleported the castle to the icelands in the north.", "src": "man_middle/s2-wand.story2.006.mp3"}, {"id": "s2-wand.story2.007", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "Presumably the goblins died in the harsh weather.", "tts": "Presumably the goblins died in the harsh weather.", "src": "man_middle/s2-wand.story2.007.mp3"}, {"id": "s2-wand.story2.008", "script": "s2-wand", "character": "hunter", "kind": "dialogue", "text": "Otherwise, no one has heard of the castle since.", "tts": "Otherwise, no one has heard of the castle since.", "src": "man_middle/s2-wand.story2.008.mp3"}, {"id": "s2-wench.main.005", "script": "s2-wench", "character": "barkeep", "kind": "dialogue", "text": "Did hell freeze over?", "tts": "Did hell freeze over?", "src": "man_middle/s2-wench.main.005.mp3"}, {"id": "s3-bh.main.001", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "Can I HELP you?", "tts": "Can I HELP you?", "src": "man_middle/s3-bh.main.001.mp3"}, {"id": "s3-bh.main.003", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "Yeah well, what the hell are you doing??", "tts": "Yeah well, what the hell are you doing??", "src": "man_middle/s3-bh.main.003.mp3"}, {"id": "s3-bh.main.005", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "I mean you just barging in here, no knocking, nothing!", "tts": "I mean you just barging in here, no knocking, nothing!", "src": "man_middle/s3-bh.main.005.mp3"}, {"id": "s3-bh.main.006", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "What's with that?", "tts": "What's with that?", "src": "man_middle/s3-bh.main.006.mp3"}, {"id": "s3-bh.main.008", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "YES, now get the HELL OUT!!", "tts": "YES, now get the HELL OUT!!", "src": "man_middle/s3-bh.main.008.mp3"}, {"id": "s3-bh.main.009", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "Can I HELP you?", "tts": "Can I HELP you?", "src": "man_middle/s3-bh.main.009.mp3"}, {"id": "s3-bh.main.011", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "You know, you've got a lot of nerve.", "tts": "You know, you've got a lot of nerve.", "src": "man_middle/s3-bh.main.011.mp3"}, {"id": "s3-bh.main.013", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "Hmmmph.", "tts": "Hmmmph.", "src": "man_middle/s3-bh.main.013.mp3"}, {"id": "s3-bh.main.016", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "WHAT, now get OUT!!", "tts": "WHAT, now get OUT!!", "src": "man_middle/s3-bh.main.016.mp3"}, {"id": "s3-bh.main.017", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "What do you want?", "tts": "What do you want?", "src": "man_middle/s3-bh.main.017.mp3"}, {"id": "s3-bh.main.019", "script": "s3-bh", "character": "grumpy homeowner", "kind": "dialogue", "text": "Just ... just please leave.", "tts": "Just ... just please leave.", "src": "man_middle/s3-bh.main.019.mp3"}, {"id": "s3-larry.main.001", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Hello sir.", "tts": "Hello sir.", "src": "man_middle/s3-larry.main.001.mp3"}, {"id": "s3-larry.talk.002", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "We're Robinson Cabinets.", "tts": "We're Robinson Cabinets.", "src": "man_middle/s3-larry.talk.002.mp3"}, {"id": "s3-larry.talk.003", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "We can supply all your wood furnishing needs.", "tts": "We can supply all your wood furnishing needs.", "src": "man_middle/s3-larry.talk.003.mp3"}, {"id": "s3-larry.talk.006", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Okay then, if you need anything I'll be ...  over ... there.", "tts": "Okay then, if you need anything I'll be ... over ... there.", "src": "man_middle/s3-larry.talk.006.mp3"}, {"id": "s3-larry.talk.008", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Please sir, no more, I need to tend to my daughter.", "tts": "Please sir, no more, I need to tend to my daughter.", "src": "man_middle/s3-larry.talk.008.mp3"}, {"id": "s3-larry.talk.010", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "See what I mean..", "tts": "See what I mean..", "src": "man_middle/s3-larry.talk.010.mp3"}, {"id": "s3-larry.talk.012", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Nope, sorry.  We pretty much contract out by jobs", "tts": "Nope, sorry. We pretty much contract out by jobs", "src": "man_middle/s3-larry.talk.012.mp3"}, {"id": "s3-larry.talk.013", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "on individual houses.  We also do countertops and the like.", "tts": "on individual houses. We also do countertops and the like.", "src": "man_middle/s3-larry.talk.013.mp3"}, {"id": "s3-larry.talk.015", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Yeah, no problem ...", "tts": "Yeah, no problem ...", "src": "man_middle/s3-larry.talk.015.mp3"}, {"id": "s3-larry.talk.017", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Oh no ...", "tts": "Oh no ...", "src": "man_middle/s3-larry.talk.017.mp3"}, {"id": "s3-larry.talk.019", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Yes dear, what is it?", "tts": "Yes dear, what is it?", "src": "man_middle/s3-larry.talk.019.mp3"}, {"id": "s3-larry.talk.021", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "But dear, we already got you one just last week.", "tts": "But dear, we already got you one just last week.", "src": "man_middle/s3-larry.talk.021.mp3"}, {"id": "s3-larry.talk.024", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Promise, I just don't know ....", "tts": "Promise, I just don't know ....", "src": "man_middle/s3-larry.talk.024.mp3"}, {"id": "s3-larry.talk.026", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Okay, okay.", "tts": "Okay, okay.", "src": "man_middle/s3-larry.talk.026.mp3"}, {"id": "s3-larry.hit.001", "script": "s3-larry", "character": "Robinson Cabinets owner", "kind": "dialogue", "text": "Hey, stop that, you'll hurt the wood.", "tts": "Hey, stop that, you'll hurt the wood.", "src": "man_middle/s3-larry.hit.001.mp3"}, {"id": "s3-mayor.talk.002", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "Thank you fair citizen.", "tts": "Thank you fair citizen.", "src": "man_middle/s3-mayor.talk.002.mp3"}, {"id": "s3-mayor.talk.005", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "What?!?  That's preposterous, you've got to be joking!", "tts": "What?!? That's preposterous, you've got to be joking!", "src": "man_middle/s3-mayor.talk.005.mp3"}, {"id": "s3-mayor.talk.008", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "That's crazy!!  ... so many people would be hurt.", "tts": "That's crazy!! ... so many people would be hurt.", "src": "man_middle/s3-mayor.talk.008.mp3"}, {"id": "s3-mayor.talk.011", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "You talked with my daughter?", "tts": "You talked with my daughter?", "src": "man_middle/s3-mayor.talk.011.mp3"}, {"id": "s3-mayor.talk.013", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "What?", "tts": "What?", "src": "man_middle/s3-mayor.talk.013.mp3"}, {"id": "s3-mayor.talk.015", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "Yes they could help.", "tts": "Yes they could help.", "src": "man_middle/s3-mayor.talk.015.mp3"}, {"id": "s3-mayor.talk.016", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "But I need proof before I can go calling them in.", "tts": "But I need proof before I can go calling them in.", "src": "man_middle/s3-mayor.talk.016.mp3"}, {"id": "s3-mayor.talk.018", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "Yes, without it my hands are tied.", "tts": "Yes, without it my hands are tied.", "src": "man_middle/s3-mayor.talk.018.mp3"}, {"id": "s3-mayor.talk.021", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "Thank you fair citizen.", "tts": "Thank you fair citizen.", "src": "man_middle/s3-mayor.talk.021.mp3"}, {"id": "s3-mayor.talk.024", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "No you didn't you liar!", "tts": "No you didn't you liar!", "src": "man_middle/s3-mayor.talk.024.mp3"}, {"id": "s3-mayor.talk.027", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "Pretty good fair citizen.", "tts": "Pretty good fair citizen.", "src": "man_middle/s3-mayor.talk.027.mp3"}, {"id": "s3-mayor.talk.031", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "Oh my god, this attack would destroy our defenses!", "tts": "Oh my god, this attack would destroy our defenses!", "src": "man_middle/s3-mayor.talk.031.mp3"}, {"id": "s3-mayor.talk.032", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "I can't believe they would attack us like this.", "tts": "I can't believe they would attack us like this.", "src": "man_middle/s3-mayor.talk.032.mp3"}, {"id": "s3-mayor.talk.034", "script": "s3-mayor", "character": "Mayor", "kind": "dialogue", "text": "Yes, I just hope they can get here in time...", "tts": "Yes, I just hope they can get here in time...", "src": "man_middle/s3-mayor.talk.034.mp3"}, {"id": "s4-end.main.001", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "Hurry up, Kelly!", "tts": "Hurry up, Kelly!", "src": "man_middle/s4-end.main.001.mp3"}, {"id": "s4-end.main.002", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "This is gonna be so great and...", "tts": "This is gonna be so great and...", "src": "man_middle/s4-end.main.002.mp3"}, {"id": "s4-end.main.003", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "WHAT THE!?!?!", "tts": "WHAT THE!?!?!", "src": "man_middle/s4-end.main.003.mp3"}, {"id": "s4-end.main.005", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "NO!!!!!", "tts": "NO!!!!!", "src": "man_middle/s4-end.main.005.mp3"}, {"id": "s4-end.main.007", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "GUARDS!!!!!!!", "tts": "GUARDS!!!!!!!", "src": "man_middle/s4-end.main.007.mp3"}, {"id": "s4-end.main.008", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "HELP!", "tts": "HELP!", "src": "man_middle/s4-end.main.008.mp3"}, {"id": "s4-end.main.009", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "THIS GUY KILLED THE BLESSED FOWL!", "tts": "THIS GUY KILLED THE BLESSED FOWL!", "src": "man_middle/s4-end.main.009.mp3"}, {"id": "s4-end.main.011", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "Kelly, what are you doing?", "tts": "Kelly, what are you doing?", "src": "man_middle/s4-end.main.011.mp3"}, {"id": "s4-end.main.016", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "Wait..isn't it all raw and such?", "tts": "Wait..isn't it all raw and such?", "src": "man_middle/s4-end.main.016.mp3"}, {"id": "s4-end.main.019", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "LESS FILLING TOO!", "tts": "LESS FILLING TOO!", "src": "man_middle/s4-end.main.019.mp3"}, {"id": "s4-end.main.022", "script": "s4-end", "character": "Kelly's father", "kind": "dialogue", "text": "Who cares about that!", "tts": "Who cares about that!", "src": "man_middle/s4-end.main.022.mp3"}, {"id": "s4-h1p.main.001", "script": "s4-h1p", "character": "paranoid man", "kind": "dialogue", "text": "AHHHHH!!!!!!", "tts": "AHHHHH!!!!!!", "src": "man_middle/s4-h1p.main.001.mp3"}, {"id": "s4-h1p.main.004", "script": "s4-h1p", "character": "paranoid man", "kind": " starving father", "kind": "dialogue", "text": "Strange customs you have.", "tts": "Strange customs you have.", "src": "man_middle/s4-h2p2.hit.002.mp3"}, {"id": "s4-md2.touch.001", "script": "s4-md2", "character": "voice behind a door 1", "kind": "dialogue", "text": "Ahh Dink, thank you, thank you!", "tts": "Ahh Dink, thank you, thank you!", "src": "man_middle/s4-md2.touch.001.mp3"}, {"id": "s4-md2.touch.002", "script": "s4-md2", "character": "voice behind a door 1", "kind": "dialogue", "text": "Who's there?", "tts": "Who's there?", "src": "man_middle/s4-md2.touch.002.mp3"}, {"id": "s4-md2.touch.004", "script": "s4-md2", "character": "voice behind a door 1", "kind": "dialogue", "text": "Never mind that.", "tts": "Never mind that.", "src": "man_middle/s4-md2.touch.004.mp3"}, {"id": "s4-md2.touch.005", "script": "s4-md2", "character": "voice behind a door 1", "kind": "dialogue", "text": "Do you have food?", "tts": "Do you have food?", "src": "man_middle/s4-md2.touch.005.mp3"}, {"id": "s4-md2.touch.007", "script": "s4-md2", "character": "voice behind a door 1", "kind": "dialogue", "text": "I need food!", "tts": "I need food!", "src": "man_middle/s4-md2.touch.007.mp3"}, {"id": "s4-md2.touch.009", "script": "s4-md2", "character": "voice behind a door 1", "kind": "dialogue", "text": "Then go away!!", "tts": "Then go away!!", "src": "man_middle/s4-md2.touch.009.mp3"}, {"id": "s4-mdoor.touch.001", "script": "s4-mdoor", "character": "voice behind a door 3", "kind": "dialogue", "text": "Thank you for saving us Dink!", "tts": "Thank you for saving us Dink!", "src": "man_middle/s4-mdoor.touch.001.mp3"}, {"id": "s4-mdoor.touch.002", "script": "s4-mdoor", "character": "voice behind a door 3", "kind": "dialogue", "text": "It's locked.", "tts": "It's locked.", "src": "man_middle/s4-mdoor.touch.002.mp3"}, {"id": "s4-mdoor.touch.003", "script": "s4-mdoor", "character": "voice behind a door 3", "kind": "dialogue", "text": "Go away.", "tts": "Go away.", "src": "man_middle/s4-mdoor.touch dle/s2-auntp.main.015.mp3"}, {"id": "s2-auntp.main.018", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Jack, this is my nephew from Stonebrook.", "tts": "Jack, this is my nephew from Stonebrook.", "src": "woman_middle/s2-auntp.main.018.mp3"}, {"id": "s2-auntp.main.019", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "He's going to be staying with us a while.", "tts": "He's going to be staying with us a while.", "src": "woman_middle/s2-auntp.main.019.mp3"}, {"id": "s2-auntp.main.021", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Dink, I've prepared a room for you upstairs.", "tts": "Dink, I've prepared a room for you upstairs.", "src": "woman_middle/s2-auntp.main.021.mp3"}, {"id": "s2-auntp.main.023", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Just ask if you need anything.", "tts": "Just ask if you need anything.", "src": "woman_middle/s2-auntp.main.023.mp3"}, {"id": "s2-auntp.talk.002", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "It's really no problem, Dink.  Have you been looking for a job at all?", "tts": "It's really no problem, Dink. Have you been looking for a job at all?", "src": "woman_middle/s2-auntp.talk.002.mp3"}, {"id": "s2-auntp.talk.005", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Saved Nadine's girl?", "tts": "Saved Nadine's girl?", "src": "woman_middle/s2-auntp.talk.005.mp3"}, {"id": "s2-auntp.talk.007", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "It's in the King's News, there is a copy at the healers.", "tts": "It's in the King's News, there is a copy at the healers.", "src": "woman_middle/s2-auntp.talk.007.mp3"}, {"id": "s2-auntp.talk.010", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Well,
