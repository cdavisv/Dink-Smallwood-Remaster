.talk.031", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "I feel safe with you upstairs.", "tts": "I feel safe with you upstairs.", "src": "woman_middle/s2-auntp.talk.031.mp3"}, {"id": "s2-auntp.talk.034", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "I would trade, but mine is the exact same size.", "tts": "I would trade, but mine is the exact same size.", "src": "woman_middle/s2-auntp.talk.034.mp3"}, {"id": "s2-auntp.talk.036", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "I'm your aunt, Dink!", "tts": "I'm your aunt, Dink!", "src": "woman_middle/s2-auntp.talk.036.mp3"}, {"id": "s2-auntp.talk.038", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "I have some work I have to do.", "tts": "I have some work I have to do.", "src": "woman_middle/s2-auntp.talk.038.mp3"}, {"id": "s2-auntp.talk.040", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "That's great.", "tts": "That's great.", "src": "woman_middle/s2-auntp.talk.040.mp3"}, {"id": "s2-auntp.talk.042", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Uh huh, fine.", "tts": "Uh huh, fine.", "src": "woman_middle/s2-auntp.talk.042.mp3"}, {"id": "s2-auntp.talk.044", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Sorry Dink, I know how young men like to tell tales.", "tts": "Sorry Dink, I know how young men like to tell tales.", "src": "woman_middle/s2-auntp.talk.044.mp3"}, {"id": "s2-auntp.talk.047", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Excuse me?", "tts": "Excuse me?", "src": "woman_middle/s2-auntp.talk.047.mp3"}, {"id": "s2-auntp.hit.002", "script": "s2-auntp", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Please.. please don't hit me!", "tts": "Please.. please don't hit me!", "src": "woman_middle/s2-auntp.hit.002.mp3"}, {"id": "s2-culg.talk.005", "script": "s2-culg", "character": "Nadine", "kind": "dialogue", "text": "Why.. Dink.  What are you doing here?", "tts": "Why.. Dink. What are you doing here?", "src": "woman_middle/s2-culg.talk.005.mp3"}, {"id": "s2-culg.talk.008", "script": "s2-culg", "character": "Nadine", "kind": "dialogue", "text": "Oh Mary!  You are home!", "tts": "Oh Mary! You are home!", "src": "woman_middle/s2-culg.talk.008.mp3"}, {"id": "s2-culg.talk.010", "script": "s2-culg", "character": "Nadine", "kind": "dialogue", "text": "Dink, thank you.  If you ever need anything, just ask.", "tts": "Dink, thank you. If you ever need anything, just ask.", "src": "woman_middle/s2-culg.talk.010.mp3"}, {"id": "s2-jack.talk.019", "script": "s2-jack", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Yes, Jack.", "tts": "Yes, Jack.", "src": "woman_middle/s2-jack.talk.019.mp3"}, {"id": "s2-jack.talk.020", "script": "s2-jack", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "What is it?", "tts": "What is it?", "src": "woman_middle/s2-jack.talk.020.mp3"}, {"id": "s2-jack.talk.024", "script": "s2-jack", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "<sob>  Dink... I..thought you were different.", "tts": "[sobs] Dink... I..thought you were different.", "src": "woman_middle/s2-jack.talk.024.mp3"}, {"id": "s2-jack.die.001", "script": "s2-jack", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Dink!  What have you done!", "tts": "Dink! What have you done!", "src": "woman_middle/s2-jack.die.001.mp3"}, {"id": "s2-jack.die.003", "script": "s2-jack", "character": "Aunt Maria Kneedlewood", "kind": "dialogue", "text": "Jack wasn't always like that.  He used to be.. <bursts into tears>", "tts": "Jack wasn't always like that. He used to be.. [bursts into tears]", "src": "woman_middle/s2-jack.die.003.mp3"}, {"id": "s2-nadp.talk.002", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "Great!", "tts": "Great!", "src": "woman_middle/s2-nadp.talk.002.mp3"}, {"id": "s2-nadp.talk.004", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "Mary just came home!  We can do that stuff later.", "tts": "Mary just came home! We can do that stuff later.", "src": "woman_middle/s2-nadp.talk.004.mp3"}, {"id": "s2-nadp.talk.006", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "She must be so afraid and lonely out there!", "tts": "She must be so afraid and lonely out there!", "src": "woman_middle/s2-nadp.talk.006.mp3"}, {"id": "s2-nadp.talk.008", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "Please leave now.", "tts": "Please leave now.", "src": "woman_middle/s2-nadp.talk.008.mp3"}, {"id": "s2-nadp.talk.010", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "Since my little girl was kidnapped, I've sort of let things go.", "tts": "Since my little girl was kidnapped, I've sort of let things go.", "src": "woman_middle/s2-nadp.talk.010.mp3"}, {"id": "s2-nadp.talk.012", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "They don't care.  We are poor.", "tts": "They don't care. We are poor.", "src": "woman_middle/s2-nadp.talk.012.mp3"}, {"id": "s2-nadp.talk.014", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "You.. you will?", "tts": "You.. you will?", "src": "woman_middle/s2-nadp.talk.014.mp3"}, {"id": "s2-nadp.talk.016", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "Mary.  Her name was Mary.", "tts": "Mary. Her name was Mary.", "src": "woman_middle/s2-nadp.talk.016.mp3"}, {"id": "s2-nadp.talk.018", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "No.. no I don't.", "tts": "No.. no I don't.", "src": "woman_middle/s2-nadp.talk.018.mp3"}, {"id": "s2-nadp.talk.021", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "You know I don't have anything!  Look at my pantry!", "tts": "You know I don't have anything! Look at my pantry!", "src": "woman_middle/s2-nadp.talk.021.mp3"}, {"id": "s2-nadp.talk.023", "script": "s2-nadp", "character": "Nadine", "kind": "dialogue", "text": "How dare you!", "tts": "How dare you!", "src": "woman_middle/s2-nadp.talk.023.mp3"}, {"id": "s3-peeps.talk.001", "script": "s3-peeps", "character": "parade spectator", "kind": "dialogue", "text": "Isn't this wonderful?", "tts": "Isn't this wonderful?", "src": "woman_middle/s3-peeps.talk.001.mp3"}, {"id": "s3-peeps.talk.002", "script": "s3-peeps", "character": "parade spectator", "kind": "dialogue", "text": "Not a very long parade was it...", "tts": "Not a very long parade was it...", "src": "woman_middle/s3-peeps.talk.002.mp3"}, {"id": "s3-peeps.talk.003", "script": "s3-peeps", "character": "parade spectator", "kind": "dialogue", "text": "This was even better than last year!", "tts": "This was even better than last year!", "src": "woman_middle/s3-peeps.talk.003.mp3"}, {"id": "s3-peeps.talk.004", "script": "s3-peeps", "character": "parade spectator", "kind": "dialogue", "text": "What a great parade!", "tts": "What a great parade!", "src": "woman_middle/s3-peeps.talk.004.mp3"}, {"id": "s3-peeps.hit.001", "script": "s3-peeps", "character": "parade spectator", "kind": "dialogue", "text": "Help!  This man is going crazy!", "tts": "Help! This man is going crazy!", "src": "woman_middle/s3-peeps.hit.001.mp3"}, {"id": "s3-peeps.hit.002", "script": "s3-peeps", "character": "parade spectator", "kind": "dialogue", "text": "Guards!!! Over here!!!", "tts": "Guards!!! Over here!!!", "src": "woman_middle/s3-peeps.hit.002.mp3"}, {"id": "s3-peeps.hit.003", "script": "s3-peeps", "character": "parade spectator", "kind": "dialogue", "text": "Help!! This Dink guy is no hero, he was behind the attack!", "tts": "Help!! This Dink guy is no hero, he was behind the attack!", "src": "woman_middle/s3-peeps.hit.003.mp3"}, {"id": "s3-peeps.hit.004", "script": "s3-peeps", "character": "parade spectator", "kind": "dialogue", "text": "Please sir... please...no!!!  Come on, help me fight this guy!", "tts": "Please sir... please...no!!! Come on, help me fight this guy!", "src": "woman_middle/s3-peeps.hit.004.mp3"}, {"id": "s4-h2p1.talk.001", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "Ahh Dink, how can we ever repay you?", "tts": "Ahh Dink, how can we ever repay you?", "src": "woman_middle/s4-h2p1.talk.001.mp3"}, {"id": "s4-h2p1.talk.002", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "I'm so glad to see my child eat again thanks to you.", "tts": "I'm so glad to see my child eat again thanks to you.", "src": "woman_middle/s4-h2p1.talk.002.mp3"}, {"id": "s4-h2p1.talk.004", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "We, we don't have a store sir.", "tts": "We, we don't have a store sir.", "src": "woman_middle/s4-h2p1.talk.004.mp3"}, {"id": "s4-h2p1.talk.006", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "Yes well, we give a lot to the ducks.", "tts": "Yes well, we give a lot to the ducks.", "src": "woman_middle/s4-h2p1.talk.006.mp3"}, {"id": "s4-h2p1.hit.001", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "But after saving us??  Nooo!", "tts": "But after saving us?? Nooo!", "src": "woman_middle/s4-h2p1.hit.001.mp3"}, {"id": "s4-h2p1.hit.002", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "Ahhh, No!", "tts": "Ahhh, No!", "src": "woman_middle/s4-h2p1.hit.002.mp3"}, {"id": "s4-h2p1.hit.003", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "We need food, not hate.", "tts": "We need food, not hate.", "src": "woman_middle/s4-h2p1.hit.003.mp3"}, {"id": "s4-h2p1.hit.004", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "Not the fists, not the fists!!", "tts": "Not the fists, not the fists!!", "src": "woman_middle/s4-h2p1.hit.004.mp3"}, {"id": "s4-h2p1.hit.005", "script": "s4-h2p1", "character": "starving mother", "kind": "dialogue", "text": "Please, don't beat a starving woman!", "tts": "Please, don't beat a starving woman!", "src": "woman_middle/s4-h2p1.hit.005.mp3"}, {"id": "s4-md3.touch.001", "script": "s4-md3", "character": "voice behind a door 2", "kind": "dialogue", "text": "Thank you for feeding us Dink,", "tts": "Thank you for feeding us Dink,", "src": "woman_middle/s4-md3.touch.001.mp3"}, {"id": "s4-md3.touch.002", "script": "s4-md3", "character": "voice behind a door 2", "kind": "dialogue", "text": "We all are in your debt.", "tts": "We all are in your debt.", "src": "woman_middle/s4-md3.touch.002.mp3"}, {"id": "s4-md3.touch.003", "script": "s4-md3", "character": "voice behind a door 2", "kind": "dialogue", "text": "Please, go away.", "tts": "Please, go away.", "src": "woman_middle/s4-md3.touch.003.mp3"}, {"id": "s4-md3.touch.004", "script": "s4-md3", "character": "voice behind a door 2", "kind": "dialogue", "text": "What do you want?", "tts": "What do you want?", "src": "woman_middle/s4-md3.touch.004.mp3"}, {"id": "s4-md3.touch.006", "script": "s4-md3", "character": "voice behind a door 2", "kind": "dialogue", "text": "Have you come with food?  My children are starving!", "tts": "Have you come with food? My children are starving!", "src": "woman_middle/s4-md3.touch.006.mp3"}, {"id": "s4-md3.touch.009", "script": "s4-md3", "character": "voice behind a door 2", "kind": "dialogue", "text": "I shouldn't talk to you anymore,", "tts": "I shouldn't talk to you anymore,", "src": "woman_middle/s4-md3.touch.009.mp3"}, {"id": "s4-md3.touch.010", "script": "s4-md3", "character": "voice behind a door 2", "kind": "dialogue", "text": "please, just go.", "tts": "please, just go.", "src": "woman_middle/s4-md3.touch.010.mp3"}, {"id": "s5-end.main.003", "script": "s5-end", "character": "Joppa mother", "kind": "dialogue", "text": "In any case, we are very grateful.", "tts": "In any case, we are very grateful.", "src": "woman_middle/s5-end.main.003.mp3"}, {"id": "s5-fguy.main.001", "script": "s5-fguy", "character": "Joppa mother", "kind": "dialogue", "text": "Gwen!!!  Come to safety!", "tts": "Gwen!!! Come to safety!", "src": "woman_middle/s5-fguy.main.001.mp3"}, {"id": "s5-fmom.talk.001", "script": "s5-fmom", "character": "Joppa mother", "kind": "dialogue", "text": "My daughter is just about your age.", "tts": "My daughter is just about your age.", "src": "woman_middle/s5-fmom.talk.001.mp3"}, {"id": "s5-guy.main.001", "script": "s5-guy", "character": "Joppa mother", "kind": "dialogue", "text": "Look!  Someone came down!", "tts": "Look! Someone came down!", "src": "woman_middle/s5-guy.main.001.mp3"}, {"id": "s5-guy.main.007", "script": "s5-guy", "character": "Joppa mother", "kind": "dialogue", "text": "They must have left.  We must go find her.. what if she is..", "tts": "They must have left. We must go find her.. what if she is..", "src": "woman_middle/s5-guy.main.007.mp3"}, {"id": "s5-guy.main.009", "script": "s5-guy", "character": "Joppa mother", "kind": "dialogue", "text": "I cannot idly wait while my daughter is in danger!", "tts": "I cannot idly wait while my daughter is in danger!", "src": "woman_middle/s5-guy.main.009.mp3"}]}, "man_old": {"desc": "Elderly man with a weathered, gravelly voice, cranky and rambling, a tall-tale teller or ex-sailor who has had a drink.", "lines": [{"id": "s2-man1.hit.001", "script": "s2-man1", "character": "old man 1", "kind": "dialogue", "text": "Ouch!", "tts": "Ouch!", "src": "man_old/s2-man1.hit.001.mp3"}, {"id": "s2-man2.main.001", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Fight!!!", "tts": "Fight!!!", "src": "man_old/s2-man2.main.001.mp3"}, {"id": "s2-man2.main.002", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Nathan, how about another story?", "tts": "Nathan, how about another story?", "src": "man_old/s2-man2.main.002.mp3"}, {"id": "s2-man2.main.003", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Alright.", "tts": "Alright.", "src": "man_old/s2-man2.main.003.mp3"}, {"id": "s2-man2.main.004", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "One time I was fighting this dragon...", "tts": "One time I was fighting this dragon...", "src": "man_old/s2-man2.main.004.mp3"}, {"id": "s2-man2.main.005", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "As I was about to deliver the death blow....", "tts": "As I was about to deliver the death blow....", "src": "man_old/s2-man2.main.005.mp3"}, {"id": "s2-man2.main.006", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "He begged me for his life.  Have you ever seen a dragon cry?", "tts": "He begged me for his life. Have you ever seen a dragon cry?", "src": "man_old/s2-man2.main.006.mp3"}, {"id": "s2-man2.main.007", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Nope.", "tts": "Nope.", "src": "man_old/s2-man2.main.007.mp3"}, {"id": "s2-man2.main.009", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Anyway, it wasn't pretty so I killed him.", "tts": "Anyway, it wasn't pretty so I killed him.", "src": "man_old/s2-man2.main.009.mp3"}, {"id": "s2-man2.main.010", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "And just where did you see a Dragon?", "tts": "And just where did you see a Dragon?", "src": "man_old/s2-man2.main.010.mp3"}, {"id": "s2-man2.main.011", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Uh.. Joppa Isle!", "tts": "Uh.. Joppa Isle!", "src": "man_old/s2-man2.main.011.mp3"}, {"id": "s2-man2.main.012", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Liar.. Joppa Isle doesn't exist, it's a story for kids.", "tts": "Liar.. Joppa Isle doesn't exist, it's a story for kids.", "src": "man_old/s2-man2.main.012.mp3"}, {"id": "s2-man2.main.013", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Did I ever tell you about the time I trained a slayer?", "tts": "Did I ever tell you about the time I trained a slayer?", "src": "man_old/s2-man2.main.013.mp3"}, {"id": "s2-man2.main.014", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "You trained a slayer!?!", "tts": "You trained a slayer!?!", "src": "man_old/s2-man2.main.014.mp3"}, {"id": "s2-man2.main.015", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Yup.  I raised him from when he was a pup.  He would do anything I told him to.", "tts": "Yup. I raised him from when he was a pup. He would do anything I told him to.", "src": "man_old/s2-man2.main.015.mp3"}, {"id": "s2-man2.main.016", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Where is he now??!", "tts": "Where is he now??!", "src": "man_old/s2-man2.main.016.mp3"}, {"id": "s2-man2.main.017", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Had to kill 'em.  Ever had slayer meat?", "tts": "Had to kill 'em. Ever had slayer meat?", "src": "man_old/s2-man2.main.017.mp3"}, {"id": "s2-man2.main.019", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "It tastes better than what you serve here, barkeep!", "tts": "It tastes better than what you serve here, barkeep!", "src": "man_old/s2-man2.main.019.mp3"}, {"id": "s2-man2.main.021", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Then there was the time I found a magic scroll", "tts": "Then there was the time I found a magic scroll", "src": "man_old/s2-man2.main.021.mp3"}, {"id": "s2-man2.main.022", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Oh yeah?", "tts": "Oh yeah?", "src": "man_old/s2-man2.main.022.mp3"}, {"id": "s2-man2.main.023", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Sure did, some strange fire spell it was.", "tts": "Sure did, some strange fire spell it was.", "src": "man_old/s2-man2.main.023.mp3"}, {"id": "s2-man2.main.024", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "I may have helped that big fire back a few seasons ago.", "tts": "I may have helped that big fire back a few seasons ago.", "src": "man_old/s2-man2.main.024.mp3"}, {"id": "s2-man2.main.025", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Quite toasty things got!", "tts": "Quite toasty things got!", "src": "man_old/s2-man2.main.025.mp3"}, {"id": "s2-man2.main.026", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Whatever, you've had too much to drink.", "tts": "Whatever, you've had too much to drink.", "src": "man_old/s2-man2.main.026.mp3"}, {"id": "s2-man2.main.027", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "You wanna go hunting?", "tts": "You wanna go hunting?", "src": "man_old/s2-man2.main.027.mp3"}, {"id": "s2-man2.main.028", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Sure I guess, why you wanna go hunting?", "tts": "Sure I guess, why you wanna go hunting?", "src": "man_old/s2-man2.main.028.mp3"}, {"id": "s2-man2.main.029", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "I hear there's a cave to the northeast with quite a catch inside it.", "tts": "I hear there's a cave to the northeast with quite a catch inside it.", "src": "man_old/s2-man2.main.029.mp3"}, {"id": "s2-man2.main.030", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "I don't know...", "tts": "I don't know...", "src": "man_old/s2-man2.main.030.mp3"}, {"id": "s2-man2.hit.001", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "You'd best learn some manners quickly, boy.", "tts": "You'd best learn some manners quickly, boy.", "src": "man_old/s2-man2.hit.001.mp3"}, {"id": "s2-man2.talk.002", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Oh really?  And who might you be?", "tts": "Oh really? And who might you be?", "src": "man_old/s2-man2.talk.002.mp3"}, {"id": "s2-man2.talk.004", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "You've had adventures, eh?", "tts": "You've had adventures, eh?", "src": "man_old/s2-man2.talk.004.mp3"}, {"id": "s2-man2.talk.006", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Yes, go on!", "tts": "Yes, go on!", "src": "man_old/s2-man2.talk.006.mp3"}, {"id": "s2-man2.talk.009", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "He's a PIG FARMER?!", "tts": "He's a PIG FARMER?!", "src": "man_old/s2-man2.talk.009.mp3"}, {"id": "s2-man2.talk.012", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Farm?!  What a loser!", "tts": "Farm?! What a loser!", "src": "man_old/s2-man2.talk.012.mp3"}, {"id": "s2-man2.talk.014", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Oh hogwash!", "tts": "Oh hogwash!", "src": "man_old/s2-man2.talk.014.mp3"}, {"id": "s2-man2.talk.015", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Hahahah!", "tts": "Hahahah!", "src": "man_old/s2-man2.talk.015.mp3"}, {"id": "s2-man2.talk.018", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "I'm sorry Dink.. I'll make it up by buying you a drink.", "tts": "I'm sorry Dink.. I'll make it up by buying you a drink.", "src": "man_old/s2-man2.talk.018.mp3"}, {"id": "s2-man2.talk.020", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "Is a bottle of SWINE ok? Bawahahah!", "tts": "Is a bottle of SWINE ok? Bawahahah!", "src": "man_old/s2-man2.talk.020.mp3"}, {"id": "s2-man2.talk.021", "script": "s2-man2", "character": "old man 2", "kind": "dialogue", "text": "Hahahah!", "tts": "Hahahah!", "s d the makings of a hero!", "tts": "I told you he had the makings of a hero!", "src": "man_old/s2-man2.talk.038.mp3"}, {"id": "s2-man2.talk.040", "script": "s2-man2", "character": "Nathan", "kind": "dialogue", "text": "No.  That was uh, two other guys...", "tts": "No. That was uh, two other guys...", "src": "man_old/s2-man2.talk.040.mp3"}, {"id": "s4-st3p.main.001", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "Good day to ye sir.", "tts": "Good day to ye sir.", "src": "man_old/s4-st3p.main.001.mp3"}, {"id": "s4-st3p.main.002", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "Arrr, I miss the sea ...", "tts": "Arrr, I miss the sea ...", "src": "man_old/s4-st3p.main.002.mp3"}, {"id": "s4-st3p.talk.002", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "What be this place ye ask?  Can't ya tell?!", "tts": "What be this place ye ask? Can't ya tell?!", "src": "man_old/s4-st3p.talk.002.mp3"}, {"id": "s4-st3p.talk.003", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "This be Blistering Pete's weapons shop,", "tts": "This be Blistering Pete's weapons shop,", "src": "man_old/s4-st3p.talk.003.mp3"}, {"id": "s4-st3p.talk.004", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "Sharpest blades this side of the sea.", "tts": "Sharpest blades this side of the sea.", "src": "man_old/s4-st3p.talk.004.mp3"}, {"id": "s4-st3p.talk.006", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "Arr, I used to be ...", "tts": "Arr, I used to be ...", "src": "man_old/s4-st3p.talk.006.mp3"}, {"id": "s4-st3p.talk.007", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "one of the best I might add.", "tts": "one of the best I might add.", "src": "man_old/s4-st3p.talk.007.mp3"}, {"id": "s4-st3p.talk.010", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "I used to live that lifestyle, blood on me blade,", "tts": "I used to live that lifestyle, blood on me blade,", "src": "man_old/s4-st3p.talk.010.mp3"}, {"id": "s4-st3p.talk.011", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "rum in me gut, and plunder in the hold.", "tts": "rum in me gut, and plunder in the hold.", "src": "man_old/s4-st3p.talk.011.mp3"}, {"id": "s4-st3p.talk.012", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "But, a small run in with the Royal navy,", "tts": "But, a small run in with the Royal navy,", "src": "man_old/s4-st3p.talk.012.mp3"}, {"id": "s4-st3p.talk.013", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "has forced me to lay low for a while.", "tts": "has forced me to lay low for a while.", "src": "man_old/s4-st3p.talk.013.mp3"}, {"id": "s4-st3p.talk.014", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "But rest assured my treasure awaits me", "tts": "But rest assured my treasure awaits me", "src": "man_old/s4-st3p.talk.014.mp3"}, {"id": "s4-st3p.talk.015", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "right where I buried it!", "tts": "right where I buried it!", "src": "man_old/s4-st3p.talk.015.mp3"}, {"id": "s4-st3p.talk.016", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "Why are ye asking?", "tts": "Why are ye asking?", "src": "man_old/s4-st3p.talk.016.mp3"}, {"id": "s4-st3p.hit.001", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "I'll kill ye, hero.", "tts": "I'll kill ye, hero.", "src": "man_old/s4-st3p.hit.001.mp3"}, {"id": "s4-st3p.hit.002", "script": "s4-st3p", "character": "Blistering Pete", "kind": "dialogue", "text": "Don't challenge me boy, I'll give you a wooden leg!!", "tts": "Don't challenge me boy, I'll give you a wooden leg!!", "src": "man_old/s4-st3p.hit.002.mp3"}, {" e took off.", "tts": "Everyone took off.", "src": "man_young/s3-loser.talk.003.mp3"}, {"id": "s3-loser.talk.005", "script": "s3-loser", "character": "parade worker", "kind": "dialogue", "text": "I don't know man, I just work here.", "tts": "I don't know man, I just work here.", "src": "man_young/s3-loser.talk.005.mp3"}, {"id": "s3-loser.talk.007", "script": "s3-loser", "character": "parade worker", "kind": "dialogue", "text": "I already told you buddy, they left.", "tts": "I already told you buddy, they left.", "src": "man_young/s3-loser.talk.007.mp3"}, {"id": "s3-loser.talk.008", "script": "s3-loser", "character": "parade worker", "kind": "dialogue", "text": "What are you, some kind of freak?", "tts": "What are you, some kind of freak?", "src": "man_young/s3-loser.talk.008.mp3"}, {"id": "s3-loser.hit.001", "script": "s3-loser", "character": "parade worker", "kind": "dialogue", "text": "Like oowwww man.", "tts": "Like oowwww man.", "src": "man_young/s3-loser.hit.001.mp3"}]}, "woman_old": {"desc": "Elderly woman, quavering, fussy and sentimental, a little nosy and fond of a drink, breaking into hysterical grief.", "lines": [{"id": "s1-h1-o.main.004", "script": "s1-h1-o", "character": "Ethel", "kind": "dialogue", "text": "It's not your fault Dink.", "tts": "It's not your fault Dink.", "src": "woman_old/s1-h1-o.main.004.mp3"}, {"id": "s1-h1-o.main.005", "script": "s1-h1-o", "character": "Ethel", "kind": "dialogue", "text": "I hope my duck wasn't in there!", "tts": "I hope my duck wasn't in there!", "src": "woman_old/s1-h1-o.main.005.mp3"}, {"id": "s1-h1-o.main.006", "script": "s1-h1-o", "character": "Ethel", "kind": "dialogue", "text": "But, if you hadn't killed my duck, your mom might still be alive.", "tts": "But, if you hadn't killed my duck, your mom might still be alive.", "src": "woman_old/s1-h1-o.main.006.mp3"}, {"id": "s1-h1-o.main.008", "script": "s1-h1-o", "character": "Ethel", "kind": "dialogue", "text": "Oh.. nothing...", "tts": "Oh.. nothing...", "src": "w  so sorry about your mother Dink,", "src": "woman_old/s1-h2-o.talk.002.mp3"}, {"id": "s1-h2-o.talk.003", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "she was a good woman.", "tts": "she was a good woman.", "src": "woman_old/s1-h2-o.talk.003.mp3"}, {"id": "s1-h2-o.talk.004", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "Kinda funny, my duck missing and your Mom dead.", "tts": "Kinda funny, my duck missing and your Mom dead.", "src": "woman_old/s1-h2-o.talk.004.mp3"}, {"id": "s1-h2-o.talk.005", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "Kinda funny, my duck and your Mom dead.", "tts": "Kinda funny, my duck and your Mom dead.", "src": "woman_old/s1-h2-o.talk.005.mp3"}, {"id": "s1-h2-o.talk.006", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "I'm so grateful to you, Dink!  You are such a dear!", "tts": "I'm so grateful to you, Dink! You are such a dear!", "src": "woman_old/s1-h2-o.talk.006.mp3"}, {"id": "s1-h2-o.talk.007", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "I'm so grateful to you, Dink!  You are wonderful!", "tts": "I'm so grateful to you, Dink! You are wonderful!", "src": "woman_old/s1-h2-o.talk.007.mp3"}, {"id": "s1-h2-o.talk.008", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "I wonder where my duck is?", "tts": "I wonder where my duck is?", "src": "woman_old/s1-h2-o.talk.008.mp3"}, {"id": "s1-h2-o.talk.010", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "You must keep searching for Quackers!  I loved him!", "tts": "You must keep searching for Quackers! I loved him!", "src": "woman_old/s1-h2-o.talk.010.mp3"}, {"id": "s1-h2-o.talk.012", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "Not so good, Dink.  Little Quackers is missing!", "tts": "Not so good, Dink. Little Quackers is missing!", "src": "woman_old/s1-h2-o.talk.012.mp3"}, {"id": "s1-h2-o.talk.013", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "I'm fine Dink, thank you for asking.", "tts": "I'm fine Dink, thank you for asking.", "src": "woman_old/s1-h2-o.talk.013.mp3"}, {"id": "s1-h2-o.talk.015", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "Quackers is gone!  Will you help me find him?", "tts": "Quackers is gone! Will you help me find him?", "src": "woman_old/s1-h2-o.talk.015.mp3"}, {"id": "s1-h2-o.talk.017", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "Thank you Dink!", "tts": "Thank you Dink!", "src": "woman_old/s1-h2-o.talk.017.mp3"}, {"id": "s1-h2-o.talk.019", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "I see...thank.. you .. I guess.", "tts": "I see...thank.. you .. I guess.", "src": "woman_old/s1-h2-o.talk.019.mp3"}, {"id": "s1-h2-o.talk.021", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "I.. I... didn't know... <begins to tear up>", "tts": "I.. I... didn't know... [begins to tear up]", "src": "woman_old/s1-h2-o.talk.021.mp3"}, {"id": "s1-h2-o.talk.024", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "What Dink?", "tts": "What Dink?", "src": "woman_old/s1-h2-o.talk.024.mp3"}, {"id": "s1-h2-o.talk.028", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "Dink ..", "tts": "Dink ..", "src": "woman_old/s1-h2-o.talk.028.mp3"}, {"id": "s1-h2-o.talk.029", "script": "s1-h2-o", "character": "Ethel", "kind": "dialogue", "text": "You've got problems.", "tts": "You've got problems.", "src": "woman_old/s1-h2-o.talk.029.mp3"}]}, "woman_young": {"desc": "Young adult woman, bright, direct and spirited, able to turn sharp, sorrowful or tearful.", "lines": [{"id": "s1-blove.main.003", "script": "s1-blove", "character": "Lyna", "kind": "dialogue", "text": "Milder... I want to get to know you first.", "tts": "Milder... I want to get to know you first.", "src": "woman_young/s1-blove.main.003.mp3"},  "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "You must hurry, Dink.", "tts": "You must hurry, Dink.", "src": "king/king.talk.023.mp3"}, {"id": "king.talk.024", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "Hello, Dink.", "tts": "Hello, Dink.", "src": "king/king.talk.024.mp3"}, {"id": "king.talk.025", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "I've heard much about you - it is good to finally meet you.", "tts": "I've heard much about you - it is good to finally meet you.", "src": "king/king.talk.025.mp3"}, {"id": "king.talk.027", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "Now what is it I can help you with?", "tts": "Now what is it I can help you with?", "src": "king/king.talk.027.mp3"}, {"id": "king.talk.029", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "Oh really?", "tts": "Oh really?", "src": "king/king.talk.029.mp3"}, {"id": "king.talk.031", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "I will take that into consideration Dink, I really will.", "tts": "I will take that into consideration Dink, I really will.", "src": "king/king.talk.031.mp3"}, {"id": "king.talk.033", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "Yes.. he was a very brave knight - he entered the darklands knowing...", "tts": "Yes.. he was a very brave knight - he entered the darklands knowing...", "src": "king/king.talk.033.mp3"}, {"id": "king.talk.034", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "full well that very few return.  And now he is lost too.", "tts": "full well that very few return. And now he is lost too.", "src": "king/king.talk.034.mp3"}, {"id": "king.talk.036", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "You Dink?  It is suicide.", "tts": "You Dink? It is suicide.", "src": "king/king.talk.036.mp3"}, {"id": "king.talk.038", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "And I cannot refuse you.", "tts": "And I cannot refuse you.", "src": "king/king.talk.038.mp3"}, {"id": "king.talk.039", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "But... just getting to the darklands is quite a challenge...", "tts": "But... just getting to the darklands is quite a challenge...", "src": "king/king.talk.039.mp3"}, {"id": "king.talk.041", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "Go north from this castle until you hit the cliffs.", "tts": "Go north from this castle until you hit the cliffs.", "src": "king/king.talk.041.mp3"}, {"id": "king.talk.042", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "I will have men there to guide you through the passage.", "tts": "I will have men there to guide you through the passage.", "src": "king/king.talk.042.mp3"}, {"id": "king.talk.043", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "And Dink...", "tts": "And Dink...", "src": "king/king.talk.043.mp3"}, {"id": "king.talk.044", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "Something very strange is happening to the world...", "tts": "Something very strange is happening to the world...", "src": "king/king.talk.044.mp3"}, {"id": "king.talk.045", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "The darklands seem to be the origin.  Please be careful.", "tts": "The darklands seem to be the origin. Please be careful.", "src": "king/king.talk.045.mp3"}, {"id": "king.hit.001", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "You have just attacked me, the King?", "tts": "You have just attacked me, the King?", "src": "king/king.hit.001.mp3"}, {"id": "king.hit.002", "script": "king", "character": "King Daniel", "kind": "dialogue", "text": "Ahh, the famous Dink Smallwood sense of humor I heard so much about!", "tts": "Ahh, the famous Dink Smallwood sense of humor I heard so much about!", "src": "king/king.hit.002.mp3"}]}, "nelson": {"desc": "Smooth, theatrical middle-aged cult leader, unctuous and sermonizing, with a gleeful cruelty underneath.", "lines": [{"id": "s2-cman.hit.001", "script": "s2-cman", "character": "Bishop Nelson", "kind": "dialogue", "text": "Kill him, Girls!", "tts": "Kill him, Girls!", "src": "nelson/s2-cman.hit.001.mp3"}, {"id": "s2-cman.hit.002", "script": "s2-cman", "character": "Bishop Nelson", "kind": "dialogue", "text": "Judgement day has cometh, sinner!", "tts": "Judgement day has cometh, sinner!", "src": "nelson/s2-cman.hit.002.mp3"}, {"id": "s2-cman.hit.003", "script": "s2-cman", "character": "Bishop Nelson", "kind": "dialogue", "text": "The girls are hungry - DINNER TIME!", "tts": "The girls are hungry - DINNER TIME!", "src": "nelson/s2-cman.hit.003.mp3"}, {"id": "s2-cman.talk.001", "script": "s2-cman", "character": "Bishop Nelson", "kind": "dialogue", "text": "You made a mistake coming here.", "tts": "You made a mistake coming here.", "src": "nelson/s2-cman.talk.001.mp3"}, {"id": "s2-cman.talk.002", "script": "s2-cman", "character": "Bishop Nelson", "kind": "dialogue", "text": "Your blood will flow like the river Jordan.", "tts": "Your blood will flow like the river Jordan.", "src": "nelson/s2-cman.talk.002.mp3"}, {"id": "s2-cman.talk.003", "script": "s2-cman", "character": "Bishop Nelson", "kind": "dialogue", "text": "Can I interest you in our love gift for December?  Only $80!", "tts": "Can I interest you in our love gift for December? Only $80!", "src": "nelson/s2-cman.talk.003.mp3"}, {"id": "s2-cslay.main.001", "script": "s2-cslay", "character": "Bishop Nelson", "kind": "dialogue", "text": "Not bad.. not bad at all.", "tts": "Not bad.. not bad at all.", "src": "nelson/s2-cslay.main.001.mp3"}, {"id": "s2-cslay.main.003", "script": "s2-cslay", "character": "Bishop Nelson", "kind": "dialogue", "text": "Is it?", "tts": "Is it?", "src": "nelson/s2-cslay.main.003.mp3"}, {"id": "s2-cslay.main.004", "script": "s2-cslay", "character": "Bishop Nelson", "kind": "dialogue", "text": "I think you are about to be an important part of my new religion.", "tts": "I think you are about to be an important part of my new religion.", "src": "nelson/s2-cslay.main.004.mp3"}, {"id": "s2-cslay.main.006", "script": "s2-cslay", "character": "Bishop Nelson", "kind": "dialogue", "text": "The martyr.", "tts": "The martyr.", "src": "nelson/s2-cslay.main.006.mp3"}, {"id": "s2-cult.main.011", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "How goes the Dead Dragon Carcass worshipping, girls?", "tts": "How goes the Dead Dragon Carcass worshipping, girls?", "src": "nelson/s2-cult.main.011.mp3"}, {"id": "s2-cult.main.013", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "Guess what, I have a little surprise for you today.", "tts": "Guess what, I have a little surprise for you today.", "src": "nelson/s2-cult.main.013.mp3"}, {"id": "s2-cult.main.015", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "No, Cindy.", "tts": "No, Cindy.", "src": "nelson/s2-cult.main.015.mp3"}, {"id": "s2-cult.main.016", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "We have a new member.  Come on out, Mary!", "tts": "We have a new member. Come on out, Mary!", "src": "nelson/s2-cult.main.016.mp3"}, {"id": "s2-cult.main.018", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "You WILL learn to love the Dead Dragon Carcass, Mary.", "tts": "You WILL learn to love the Dead Dragon Carcass, Mary.", "src": "nelson/s2-cult.main.018.mp3"}, {"id": "s2-cult.main.021", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "Excellent point, Jennifer.", "tts": "Excellent point, Jennifer.", "src": "nelson/s2-cult.main.021.mp3"}, {"id": "s2-cult.main.026", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "I don't think so, Smallwood.", "tts": "I don't think so, Smallwood.", "src": "nelson/s2-cult.main.026.mp3"}, {"id": "s2-cult.main.031", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "Come here, child.", "tts": "Come here, child.", "src": "nelson/s2-cult.main.031.mp3"}, {"id": "s2-cult.main.033", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "The Dead Dragon Carcass is calling for a sacrifice...", "tts": "The Dead Dragon Carcass is calling for a sacrifice...", "src": "nelson/s2-cult.main.033.mp3"}, {"id": "s2-cult.main.034", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "HIM!", "tts": "HIM!", "src": "nelson/s2-cult.main.034.mp3"}, {"id": "s2-cult.main.036", "script": "s2-cult", "character": "Bishop Nelson", "kind": "dialogue", "text": "You see, my girls are more than meets the eye.", "tts": "You see, my girls are more than meets the eye.", "src": "nelson/s2-cult.main.036.mp3"}]}, "mother": {"desc": "Middle-aged farm mother, brisk, dry and affectionate, with deadpan patience for a sulky teenage son.", "lines": [{"id": "s1-h1-m.main.001", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "Dink, it's getting late!  No food until you feed the pigs!", "tts": "Dink, it's getting late! No food until you feed the pigs!", "src": "mother/s1-h1-m.main.001.mp3"}, {"id": "s1-h1-m.main.002", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "Dink, can you do something for me?", "tts": "Dink, can you do something for me?", "src": "mother/s1-h1-m.main.002.mp3"}, {"id": "s1-h1-m.main.004", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "Can you go out to the woods and see if you can get,", "tts": "Can you go out to the woods and see if you can get,", "src": "mother/s1-h1-m.main.004.mp3"}, {"id": "s1-h1-m.main.005", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "some AlkTree nuts, I think they're in season.", "tts": "some AlkTree nuts, I think they're in season.", "src": "mother/s1-h1-m.main.005.mp3"}, {"id": "s1-h1-m.main.007", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "You're a dear.", "tts": "You're a dear.", "src": "mother/s1-h1-m.main.007.mp3"}, {"id": "s1-h1-m.main.008", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "Dink, would you go feed the pigs?", "tts": "Dink, would you go feed the pigs?", "src": "mother/s1-h1-m.main.008.mp3"}, {"id": "s1-h1-m.main.010", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "YES, NOW.", "tts": "YES, NOW.", "src": "mother/s1-h1-m.main.010.mp3"}, {"id": "s1-h1-m.talk.002", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "That's very amusing, Dink.  You get the sack of feed, and you", "tts": "That's very amusing, Dink. You get the sack of feed, and you", "src": "mother/s1-h1-m.talk.002.mp3"}, {"id": "s1-h1-m.talk.003", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "sprinkle it in the pig pen.  And don't tease them!", "tts": "sprinkle it in the pig pen. And don't tease them!", "src": "mother/s1-h1-m.talk.003.mp3"}, {"id": "s1-h1-m.talk.005", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "He was a peasant like us.", "tts": "He was a peasant like us.", "src": "mother/s1-h1-m.talk.005.mp3"}, {"id": "s1-h1-m.talk.007", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "Of course not.  He was a wonderful farmer and husband.", "tts": "Of course not. He was a wonderful farmer and husband.", "src": "mother/s1-h1-m.talk.007.mp3"}, {"id": "s1-h1-m.talk.009", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "The villagers are very friendly.  Oh, Ethel wants to see you.", "tts": "The villagers are very friendly. Oh, Ethel wants to see you.", "src": "mother/s1-h1-m.talk.009.mp3"}, {"id": "s1-h1-m.talk.011", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "Yes Dink, she is. <laugh>", "tts": "Yes Dink, she is. [laughs]", "src": "mother/s1-h1-m.talk.011.mp3"}, {"id": "s1-h1-m.talk.013", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "You'll get over it.", "tts": "You'll get over it.", "src": "mother/s1-h1-m.talk.013.mp3"}, {"id": "s1-h1-m.talk.015", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "Good boy.  Go visit our neighbors while I prepare dinner.", "tts": "Good boy. Go visit our neighbors while I prepare dinner.", "src": "mother/s1-h1-m.talk.015.mp3"}, {"id": "s1-h1-m.hit.001", "script": "s1-h1-m", "character": "Mother", "kind": "dialogue", "text": "Ouch!  Stop it!", "tts": "Ouch! Stop it!", "src": "mother/s1-h1-m.hit.001.mp3"}]}, "seth": {"desc": "Ancient, malevolent being with a deep, calm, resonant voice and unhurried menace that swells into a roaring taunt in combat.", "lines": [{"id": "s7-boss.hit.001", "script": "s7-boss", "character": "Seth", "kind": "dialogue", "text": "Watch Conan O'brien!", "tts": "Watch Conan O'brien!", "src": "seth/s7-boss.hit.001.mp3"}, {"id": "s7-boss.hit.002", "script": "s7-boss", "character": "Seth", "kind": "dialogue", "text": "MOTHER!!!!!!!!!!", "tts": "MOTHER!!!!!!!!!!", "src": "seth/s7-boss.hit.002.mp3"}, {"id": "s7-boss.hit.003", "script": "s7-boss", "character": "Seth", "kind": "dialogue", "text": "FEEL MY WRATH, SMALLWOOD!", "tts": "FEEL MY WRATH, SMALLWOOD!", "src": "seth/s7-boss.hit.003.mp3"}, {"id": "s7-boss.hit.004", "script": "s7-boss", "character": "Seth", "kind": "dialogue", "text": "I felt that.", "tts": "I felt that.", "src": "seth/s7-boss.hit.004.mp3"}, {"id": "s7-boss.hit.005", "script": "s7-boss", "character": "Seth", "kind": "dialogue", "text": "Listen to the birds.. even they are calling for your heart.", "tts": "Listen to the birds.. even they are calling for your heart.", "src": "seth/s7-boss.hit.005.mp3"}, {"id -tree", "character": "talking tree", "kind": "dialogue", "text": "There is a rock near the Duck Idol with a crack in it...", "tts": "There is a rock near the Duck Idol with a crack in it...", "src": "tree/s4-tree.hit.002.mp3"}, {"id": "s4-tree.hit.003", "script": "s4-tree", "character": "talking tree", "kind": "dialogue", "text": "Please sir, don't hurt me, the talking tree of the east!", "tts": "Please sir, don't hurt me, the talking tree of the east!", "src": "tree/s4-tree.hit.003.mp3"}, {"id": "s4-tree.hit.004", "script": "s4-tree", "character": "talking tree", "kind": "dialogue", "text": "That one smarted!", "tts": "That one smarted!", "src": "tree/s4-tree.hit.004.mp3"}, {"id": "s4-tree.hit.005", "script": "s4-tree", "character": "talking tree", "kind": "dialogue", "text": "That's gonna leave a mark!", "tts": "That's gonna leave a mark!", "src": "tree/s4-tree.hit.005.mp3"}]}, "mog": {"desc": "Goblin king, deep and imperious, fluent and articulate, bellowing with rage when his brothers lie dead and reduced to a weak plea when dying.", "lines": [{"id": "en-gmog.die.001", "script": "en-gmog", "character": "Mog", "kind": "dialogue", "text": "Please...", "tts": "Please...", "src": "mog/en-gmog.die.001.mp3"}, {"id": "en-gmog.die.002", "script": "en-gmog", "character": "Mog", "kind": "dialogue", "text": "I will tell you where the secret Cast camp is...", "tts": "I will tell you where the secret Cast camp is...", "src": "mog/en-gmog.die.002.mp3"}, {"id": "s3-mog.main.002", "script": "s3-mog", "character": "Mog", "kind": "dialogue", "text": "Who dares wake the mighty Mog, king of Goblins?", "tts": "Who dares wake the mighty Mog, king of Goblins?", "src": "mog/s3-mog.main.002.mp3"}, {"id": "s3-mog.main.004", "script": "s3-mog", "character": "Mog", "kind": "dialogue", "text": "Of course.  I was raised by.. what is this?  My comrades litter the ground!", "tts": "Of course. I was raised by.. what is this? My comrades litter the ground!", "src": "mog/s3-mog.main.004.mp3"}, {"id": "s3-mog.main.007", "script": "s3-mog", "character": "Mog", "kind": "dialogue", "text": "You?  YOU?  I MUST AVENGE MY BROTHERS!", "tts": "You? YOU? I MUST AVENGE MY BROTHERS!", "src": "mog/s3-mog.main.007.mp3"}]}, "dragon": {"desc": "Vast, ancient dragon, a low rumbling slow voice, solemn and vengeful.", "lines": [{"id": "s5-fguy.main.004", "script": "s5-fguy", "character": "dragon", "kind": "dialogue", "text": "Run from us no more, humans.", "tts": "Run from us no more, humans.", "src": "dragon/s5-fguy.main.004.mp3"}, {"id": "s5-fguy.main.005", "script": "s5-fguy", "character": "dragon", "kind": "dialogue", "text": "Let us finish it.", "tts": "Let us finish it.", "src": "dragon/s5-fguy.main.005.mp3"}]}};
const KEY = 'dink_voice_verdicts';
let V = {}; try { V = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { V = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(V)); } catch (e) {} stat(); }
const voices = Object.keys(DATA);
let cur = voices[0], idx = 0, shown = [];
const $ = s => document.querySelector(s);
function stat() {
  const all = voices.flatMap(v => DATA[v].lines);
  const n = all.filter(l => V[l.id] && V[l.id].v).length, r = all.filter(l => V[l.id] && V[l.id].v === 'redo').length;
  $('#stat').textContent = `${n} of ${all.length} reviewed, ${r} marked redo`;
  $('#tot').textContent = all.length;
  document.querySelectorAll('#nav button').forEach(b => {
    const v = b.dataset.v, L = DATA[v].lines, k = L.filter(l => V[l.id] && V[l.id].v).length;
    b.querySelector('small').textContent = `${k}/${L.length}`;
  });
}
function nav() {
  $('#nav').innerHTML = voices.map(v => `<button data-v="${v}" class="${v === cur ? 'on' : ''}">${v} <small></small></button>`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { cur = b.dataset.v; idx = 0; render(); });
}
function seeded(arr, n) { // deterministic sample so the same 10 come back next session
  let s = 2166; const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n).sort((x, y) => arr.indexOf(x) - arr.indexOf(y));
}
function render() {
  nav();
  const d = DATA[cur]; $('#vname').textContent = `${cur} (${d.lines.length} takes)`; $('#vdesc').textContent = d.desc;
  let L = d.lines; const n = +$('#samp').value; if (n) L = seeded(L, n);
  if ($('#unrev').checked) L = L.filter(l => !(V[l.id] && V[l.id].v));
  shown = L; idx = Math.min(idx, Math.max(0, L.length - 1));
  $('#list').innerHTML = L.map((l, i) => {
    const v = V[l.id] || {};
    return `<div class="take ${v.v || ''}" data-i="${i}" id="t${i}">
<div><div class="who">${esc(l.character)} · <code>${l.id}</code> · ${l.kind}</div>
<div class="txt">${esc(l.text)}</div>
<audio preload="none" controls src="${l.src}"></audio></div>
<div class="v"><button class="k">Keep (K)</button><button class="r">Redo (R)</button><input placeholder="note" value="${esc(v.note || '')}"></div></div>`;
  }).join('') || '<p class="help">Nothing to show with these filters.</p>';
  document.querySelectorAll('.take').forEach(t => {
    const i = +t.dataset.i, l = L[i], a = t.querySelector('audio');
    t.querySelector('.k').onclick = () => mark(i, 'keep');
    t.querySelector('.r').onclick = () => mark(i, 'redo');
    t.querySelector('input').onchange = e => { V[l.id] = Object.assign(V[l.id] || {}, { note: e.target.value, voice: cur }); save(); };
    a.onplay = () => { idx = i; hl(false); document.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); }); };
    a.onended = () => { if ($('#auto').checked) go(i + 1, true); };
  });
  hl(false); stat();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function hl(scroll) { document.querySelectorAll('.take').forEach(t => t.classList.toggle('cur', +t.dataset.i === idx)); const t = $('#t' + idx); if (t && scroll) t.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
function mark(i, v) { const l = shown[i]; if (!l) return; V[l.id] = Object.assign(V[l.id] || {}, { v, voice: cur }); save(); const t = $('#t' + i); if (t) { t.classList.remove('keep', 'redo'); t.classList.add(v); } go(i + 1, true); }
function go(i, play) { if (i < 0 || i >= shown.length) return; idx = i; hl(true); const a = $('#t' + i + ' audio'); if (a && play) { a.currentTime = 0; a.play(); } }
function toggle() { const a = $('#t' + idx + ' audio'); if (!a) return; a.paused ? a.play() : a.pause(); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'k' || e.key === 'K') mark(idx, 'keep');
  else if (e.key === 'r' || e.key === 'R') mark(idx, 'redo');
  else if (e.key === 'n' || e.key === 'N') go(idx + 1, true);
  else if (e.key === 'p' || e.key === 'P') go(idx - 1, true);
});
$('#play').onclick = toggle; $('#unrev').onchange = render; $('#samp').onchange = render;
$('#exp').onclick = () => {
  const rows = [['id', 'voice', 'verdict', 'note']];
  voices.forEach(v => DATA[v].lines.forEach(l => { const x = V[l.id]; if (x && (x.v || x.note)) rows.push([l.id, v, x.v || '', x.note || '']); }));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'voice_verdicts.csv'; a.click();
};
render();
</script>
